                enabled:
                  type: boolean
                webhook_url:
                  type: string
      responses:
        '204':
          description: Changed.
        '400':
          $ref: '#/components/responses/BadWebhook'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteT2D
      tags: [forwarding]
      summary: Delete a Telegram to Discord webhook
      description: Audited as fwd_t2d_delete.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/forwarding/telegram-discord/{id}/transfer:
    post:
      x-tgd-status: planned
      operationId: transferT2D
      tags: [forwarding]
      summary: Give a webhook to another owner
      description: >-
        Admins, between accounts of their federations, and superadmins
        (web-accounts.md section 6); a member gets 404.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transfer'
      responses:
        '204':
          description: Transferred.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/forwarding/discord-telegram:
    post:
      operationId: createD2T
      tags: [forwarding]
      summary: Add a Discord to Telegram route
      description: >-
        The viewer becomes its owner. The route is read by the Discord
        bot discord_bot_id and sent through the Telegram bot
        telegram_bot_id, both bots the viewer may use (GET /api/bots);
        no token is typed on a route. The chat is a group, a channel or
        a private chat (a positive chat_id). Refusals: 400 bad_channel
        (not a Discord id), bad_request (a bot of the other kind, a
        missing field); 404 for a chat, a federation or a bot the viewer
        may not use; 409 duplicate when the channel already forwards to
        the chat. federation_id is needed only when more than one of
        the owner's federations holds the group. Audited as
        fwd_d2t_create and owner_set.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/D2TCreate'
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/forwarding/discord-telegram/{id}:
    patch:
      operationId: updateD2T
      tags: [forwarding]
      summary: Change a Discord to Telegram route
      description: >-
        The fields given change, the others stay: the channel, the chat
        and either bot too, each checked as on creation (409 duplicate
        when the channel already forwards to the new chat). The bots
        the route had stay, for other routes. Audited as
        fwd_d2t_update.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                discord_channel_id:
                  type: string
                chat_id:
                  type: integer
                  format: int64
                types:
                  $ref: '#/components/schemas/D2TTypes'
                enabled:
                  type: boolean
                discord_bot_id:
                  type: integer
                  format: int64
                telegram_bot_id:
                  type: integer
                  format: int64
      responses:
        '204':
          description: Changed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteD2T
      tags: [forwarding]
      summary: Delete a Discord to Telegram route
      description: >-
        A route that has sent messages is refused (409 in_use): those
        rows map Discord messages to their Telegram copies for replies
        and edits; disable it instead. Audited as fwd_d2t_delete.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/forwarding/discord-telegram/{id}/transfer:
    post:
      x-tgd-status: planned
      operationId: transferD2T
      tags: [forwarding]
      summary: Give a route to another owner
      description: >-
        Admins, between accounts of their federations, and superadmins
        (web-accounts.md section 6); a member gets 404.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transfer'
      responses:
        '204':
          description: Transferred.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/bots:
    get:
      operationId: listBots
      tags: [forwarding]
      summary: The bots the viewer may use
      description: >-
        For the bot pickers of the route forms: a member with `forward`
        gets its own bots, admins and superadmins every bot
        (decisions/2026-11-18-ownership-and-bots.md). Others get 404.
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BotKind'
      responses:
        '200':
          description: The bots.
          content:
            application/json:
              schema:
                type: object
                required: [bots]
                properties:
                  bots:
                    type: array
                    items:
                      $ref: '#/components/schemas/BotRef'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createBot
      tags: [forwarding]
      summary: Add a bot
      description: >-
        The viewer becomes its owner; it starts connecting. The token is
        write-only and never answered. Re-adding one of the viewer's own
        bots answers that bot. Refusals: 400 bad_token (its shape), 400
        bad_request (a name that is empty or over 64 characters); 409
        token_in_use when another account has the bot, without saying
        which. Audited as bot_create, without the token.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotCreate'
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/bots/{id}:
    patch:
      operationId: updateBot
      tags: [forwarding]
      summary: Rename, enable or disable a bot, or replace its token
      description: >-
        One of the viewer's bots (any bot for admins and superadmins);
        others answer 404. Audited as bot_update, without the token.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotUpdate'
      responses:
        '200':
          description: The bot as it is now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteBot
      tags: [forwarding]
      summary: Remove a bot
      description: >-
        Refused with 409 bot_in_use, with a message saying how many
        routes use it, while Discord to Telegram routes use the bot.
        Audited as bot_delete.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/bots/{id}/transfer:
    post:
      operationId: transferBot
      tags: [forwarding]
      summary: Give a bot to another owner
      description: >-
        Admins and superadmins, to one of the bot's transfer_candidates;
        a member gets 404. A route whose owner no longer owns its bots
        keeps working; giving a route to a member needs both its bots to
        be the member's (409 bot_not_owned on the route's transfer).
        Audited as bot_transfer.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transfer'
      responses:
        '204':
          description: Transferred.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/join-chat/preview:
    post:
      operationId: previewJoin
      tags: [join-chat]
      summary: Look up a group or channel before joining it
      description: >-
        Read-only on the account, but behind CSRF since each lookup
        costs a rate-limited Telegram request (web/docs/join-chat.md).
        A lookup that found nothing still answers 200, with chat null
        and the reason in message. For superadmins and admins holding
        join_chat; anyone else gets 404.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref]
              properties:
                ref:
                  type: string
                  description: An invite link or a public username, at most 256 bytes.
      responses:
        '200':
          description: The outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinOutcome'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/DaemonFailed'

  /api/join-chat/join:
    post:
      operationId: joinChat
      tags: [join-chat]
      summary: Join a group or channel
      description: >-
        For superadmins and admins holding join_chat; anyone else gets
        404. Writes one chat_join audit row whatever comes of it, once
        the request passes its checks (web/docs/join-chat.md). A joined
        group is added to the chosen federations, which must be ones
        the viewer administers (404 otherwise, before anything is
        joined); none leaves it in Default (web-accounts.md section 3).
        Filing the group into the chosen ones comes with
        join-chat-federations; until then it stays in Default.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref]
              properties:
                ref:
                  type: string
                federation_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
      responses:
        '200':
          description: The outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinOutcome'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/DaemonFailed'

  /api/users/{id}/lookup-name:
    post:
      operationId: lookupName
      tags: [contacts]
      summary: Look up a contact's own name
      description: >-
        "Look up real name" (web/docs/contact-names.md): the daemon
        removes the contact, reads the name the user gave itself and
        adds the contact back exactly as it was. It changes the logging
        account's contacts, so it is for superadmins only; anyone else,
        and a user the viewer may not see or the logger never saw, gets
        404. A user the logger does not record as a contact is 409
        not_a_contact before the daemon is asked. Otherwise the daemon's
        answer is passed on: its errors (docs/internal-api.md) keep
        their code, with the status 404 not_found, 409 not_a_contact or
        unsupported, 429 rate_limited or flood_wait, 503 unavailable or
        restore_pending, 504 timeout, 502 telegram_error, and
        Retry-After when the daemon sent one; any other failure is 502
        daemon. Every request that reaches the daemon writes one
        contact_lookup audit row, "user <id>: ok" or the error code.
      security:
        - session: []
          csrf: []
      parameters:
        - name: id
          in: path
          required: true
          description: The user's Telegram id.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The own name, now stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupName'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: The daemon allows no lookup now (error rate_limited or flood_wait).
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/DaemonFailed'
        '503':
          description: >-
            The daemon is busy or not connected (error unavailable), or a
            contact is removed and not added back yet (error
            restore_pending).
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: >-
            The contact is added back, but Telegram did not report the
            own name in time (error timeout); nothing was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/mcp/groups:
    post:
      operationId: exposeMcpGroup
      tags: [mcp]
      summary: Expose a group through the MCP endpoint
      description: >-
        For viewers with the mcp ability (superadmins and admins
        today), and only groups the viewer may see (web-accounts.md
        section 4): a hidden or unknown group is 404. The note is cut
        to 255 characters. A group already exposed is 409
        already_exposed; to change its note, withdraw it and expose it
        again. Exposing also makes the group's chat public on the web
        (web/docs/mcp.md). Audited as mcp_expose.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_id]
              properties:
                group_id:
                  type: integer
                  format: int64
                note:
                  type: string
      responses:
        '201':
          description: Exposed.
          content:
            application/json:
              schema:
                type: object
                required: [group_id]
                properties:
                  group_id:
                    type: integer
                    format: int64
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/mcp/groups/{group_id}:
    delete:
      operationId: unexposeMcpGroup
      tags: [mcp]
      summary: Stop exposing a group
      description: >-
        A group the viewer may not see, or one not exposed, is 404.
        Audited as mcp_unexpose.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '204':
          description: No longer exposed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/mcp/tokens:
    post:
      operationId: createMcpToken
      tags: [mcp]
      summary: Create an MCP bearer token
      description: >-
        The token (tgmcp_ and 64 hex digits) is in this answer only; it
        is stored as its SHA-256 and in no log or audit row. The name,
        1 to 64 characters after trimming, tells tokens apart. Owned by
        the viewer. Audited as mcp_token_create, with the name.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [id, token]
                properties:
                  id:
                    type: integer
                    format: int64
                  token:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/mcp/tokens/{id}/revoke:
    post:
      operationId: revokeMcpToken
      tags: [mcp]
      summary: Revoke an MCP bearer token
      description: >-
        Stamps the token revoked; the row stays for the audit trail.
        Revoking a revoked token changes nothing and answers 204 too.
        Audited as mcp_token_revoke.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'

  /mcp:
    post:
      operationId: postMcp
      tags: [mcp]
      summary: One MCP message (JSON-RPC 2.0)
      description: >-
        The Model Context Protocol endpoint, read-only, for language
        model clients (web/docs/mcp.md). The body is one JSON-RPC 2.0
        message: a request of initialize, ping, tools/list or
        tools/call, or a notification. The transport is Streamable
        HTTP in its minimal form: every answer is one application/json
        body, there is no SSE stream and no session (no
        Mcp-Session-Id). Protocol 2025-06-18; 2025-03-26 is accepted.


        The tools read only the groups an administrator put on the
        exposure list (telegram_public_groups); the user tools describe
        accounts and are not limited to it. A tool's failure the caller
        can fix (a bad filter, an unknown id) is a result with isError
        true; a malformed call is a JSON-RPC error. Both are answered
        with 200, and so is a body that is empty or not JSON (error
        -32700).


        Authenticated by an MCP bearer token (tgmcp_ and 64 hex digits,
        made in the MCP administration), in the Authorization header or,
        for clients that can only be given a URL, in the key query
        parameter; the header wins. No session cookie and no CSRF
        token. A refusal is a JSON-RPC error with a null id and no
        WWW-Authenticate header, on purpose (web/docs/mcp.md).
      security:
        - mcpToken: []
        - mcpKey: []
      parameters:
        - name: key
          in: query
          required: false
          description: The token, for clients that cannot set a header.
          schema:
            type: string
        - name: MCP-Protocol-Version
          in: header
          required: false
          description: >-
            The negotiated protocol version. Only its shape is checked
            (YYYY-MM-DD); initialize negotiates the version itself.
          schema:
            type: string
        - name: Origin
          in: header
          required: false
          description: >-
            Checked only when MCP_ALLOWED_ORIGINS is set; any origin is
            accepted otherwise.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpMessage'
      responses:
        '200':
          description: >-
            The JSON-RPC answer: a result, or an error (also for a body
            that is empty, not JSON, a batch or not a JSON-RPC request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpAnswer'
        '202':
          description: A notification (or a response) was accepted; no body.
        '400':
          description: MCP-Protocol-Version is not a YYYY-MM-DD date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpAnswer'
        '401':
          description: >-
            No token, a malformed one, or one that is unknown, revoked or
            belongs to a disabled account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpAnswer'
        '403':
          description: Origin is not in MCP_ALLOWED_ORIGINS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpAnswer'
        '413':
          description: The body is larger than 1 MiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpAnswer'
        '500':
          description: The tokens could not be checked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpAnswer'
    get:
      operationId: getMcp
      tags: [mcp]
      summary: Declined; no server-to-client stream is offered
      description: >-
        Answers 405 with Allow POST, which the protocol provides for a
        server that never initiates messages. Needs no token.
      security: []
      responses:
        '405':
          description: No SSE stream.
          headers:
            Allow:
              description: POST
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
    delete:
      operationId: deleteMcp
      tags: [mcp]
      summary: Declined; the endpoint keeps no sessions
      security: []
      responses:
        '405':
          description: No session to end.
          headers:
            Allow:
              description: POST
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string

  /api/users/{id}/history:
    get:
      operationId: getUserHistory
      tags: [history]
      summary: A page of a user's change timeline
      description: >-
        The user's names, usernames (every event: added, removed,
        reordered, kind or collectible changed), bios, phone numbers and
        profile photos, newest first, as the user page's history: the
        page carries the first page and history_next, and this answers
        the following ones, from the cursor of the page before. Only for
        a viewer who sees users in full; to a member, as for a user the
        viewer may not see or the logger never saw, it is 404.
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          description: The user's Telegram id.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/HistoryBefore'
        - $ref: '#/components/parameters/HistoryLimit'
      responses:
        '200':
          description: The page, and the cursor of the next.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/users/{id}/photos:
    get:
      operationId: getUserPhotos
      tags: [history]
      summary: Every recorded profile photo of a user
      description: >-
        The user's profile photos as the logger recorded them
        (telegram_user_hist_profile_photo), newest first and at most
        500, for the user page's photo carousel; the photo removals are
        left out. Each item's id is the photo_id of its photo change in
        the user's history (HistoryEntry), so the timeline can open the
        carousel at that photo. current_id is the item of the user's
        current photo: the newest one with the file that is the
        profile photo now, or null when there is none (no photo, or its
        file not among them). The same access as the history: only for
        a viewer who sees users in full; to a member, as for a user the
        viewer may not see or the logger never saw, it is 404.
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          description: The user's Telegram id.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The photos, and which is the current one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPhotos'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/groups/{id}/history:
    get:
      operationId: getGroupHistory
      tags: [history]
      summary: A page of a group's change timeline
      description: >-
        The group's titles, descriptions, usernames (every event),
        photos and admin changes, newest first, as the group page's
        history: the page carries the first page and history_next, and
        this answers the following ones. For a group the viewer sees;
        any other is 404.
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          description: The group's Telegram chat id.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/HistoryBefore'
        - $ref: '#/components/parameters/HistoryLimit'
      responses:
        '200':
          description: The page, and the cursor of the next.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/groups/{id}/photos:
    get:
      operationId: getGroupPhotos
      tags: [history]
      summary: Every recorded photo of a group
      description: >-
        The group's photos as the logger recorded them
        (telegram_group_hist_photo), newest first and at most 500, for
        the group page's photo carousel, as getUserPhotos answers for a
        user; the photo removals are left out. Each item's id is the
        photo_id of its photo change in the group's history
        (GroupHistoryEntry). current_id is the item of the group's
        current photo (telegram_groups.photo_file_id): the newest one
        with that file, or null. For a group the viewer sees, as the
        group page and its history; any other, a group hidden from an
        admin included, is 404. Not public, not even for an exposed
        group.
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          description: The group's Telegram chat id.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The photos, and which is the current one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPhotos'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

components:

  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: tgw_session
      description: >-
        The signed session cookie, set by POST /api/login. Valid only
        while it has not expired and its session_epoch is the
        account's; sessions are shared with the Drogon web.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        The session's CSRF token, from GET /api/session, POST
        /api/login or the page's csrf-token meta tag. Required with the
        session on every state-changing request.
    loginCsrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: The pre-login token from GET /api/login.
    loginCookie:
      type: apiKey
      in: cookie
      name: tgw_csrf
      description: The pre-login cookie GET /api/login sets (path /api/login).
    apiToken:
      x-tgd-status: planned
      type: http
      scheme: bearer
      description: >-
        Planned, not accepted yet: per-account API tokens for clients
        that cannot keep cookies or CSRF tokens (native apps, scripts),
        web-accounts.md section 7. How they are issued and what they
        look like is not designed yet; until then the cookie session
        is the only authentication.
    mcpToken:
      type: http
      scheme: bearer
      description: >-
        An MCP bearer token, tgmcp_ and 64 lowercase hex digits, made in
        the MCP administration and stored only as its SHA-256. Accepted
        by /mcp only.
    mcpKey:
      type: apiKey
      in: query
      name: key
      description: >-
        The same token in the query string, for MCP clients that accept
        only a URL. Weaker than the header: a query string reaches proxy
        logs and browser history (web/docs/mcp.md).

  headers:
    NoStore:
      description: no-store
      schema:
        type: string
    LoginCookie:
      description: tgw_csrf, the fresh pre-login token.
      schema:
        type: string
    AcceptRanges:
      description: bytes
      schema:
        type: string
    FileCacheControl:
      description: public, max-age=604800
      schema:
        type: string
    ContentDisposition:
      description: >-
        attachment; filename=<name>, for a file not shown inline
        (documents and the like).
      schema:
        type: string

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    GroupId:
      name: group_id
      in: path
      required: true
      description: The group's Telegram chat id.
      schema:
        type: integer
        format: int64
    ChatScope:
      name: scope
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MessageScope'
    HistoryBefore:
      name: before
      in: query
      required: false
      description: >-
        The cursor a page answered as next (history_next on the page):
        the entries after it. Absent, the newest. One that does not
        parse is 400 bad_request.
      schema:
        type: string
    HistoryLimit:
      name: limit
      in: query
      required: false
      description: Entries per page, 100 when absent; 1 to 500, else 400 bad_request.
      schema:
        type: integer
        minimum: 1
        maximum: 500

  responses:
    BadRequest:
      description: A malformed request (error bad_request).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: >-
        No valid session (error unauthenticated); a revoked session
        cookie is cleared.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SessionUnavailable:
      description: >-
        The session could not be checked against the database (error
        unavailable); the cookie is kept.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Csrf:
      description: >-
        The CSRF token is missing or wrong (error csrf), or a gate is
        up (see Gates in the description).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: >-
        No such thing, or one the viewer may not see (error not_found).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Gate:
      description: >-
        A gate is up (see Gates in the description): error
        password_change_required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LastSuperadmin:
      description: >-
        The change would leave no active superadmin (error
        last_superadmin).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadWebhook:
      description: >-
        Not a Discord webhook URL (error bad_webhook), or another
        malformed request (error bad_request).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DaemonFailed:
      description: >-
        The daemon gave no outcome: its API is off or unreachable,
        TDLib is not ready, or Telegram did not answer in time (error
        daemon); message says what to do.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: >-
        The change conflicts with what is stored (the error code says
        what; message is the sentence to show).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: Something failed on the server (error internal).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: A machine-readable code (csrf, not_found, ...).
        message:
          type: string
          description: A sentence for a person to read, where there is one.
    FieldError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            field:
              type: string
              description: The key whose value was refused, when one was.
    LoginError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [message, csrf]
          properties:
            message:
              type: string
            csrf:
              type: string
              description: A fresh pre-login token, to try again with.
    Health:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          required: [ro, app]
          properties:
            ro:
              type: string
              enum: [ok, unavailable]
            app:
              type: string
              enum: [ok, unavailable]
    LoginState:
      type: object
      required: [signed_in]
      properties:
        signed_in:
          type: boolean
        csrf:
          type: string
          description: The pre-login token; only when signed_in is false.
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    SessionUser:
      type: object
      required: [id, username, role, must_change_password]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        must_change_password:
          type: boolean
          description: >-
            The account signed in with a password set for it (typed by
            its creator, or a temporary one) and must choose its own
            (POST /api/account/password) before anything else; see
            Gates in the description.
    Session:
      type: object
      required: [user, csrf]
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
        csrf:
          type: string
          description: The session's CSRF token.
        landing:
          type: string
          description: >-
            The account's landing page (its preference, else /): where a
            sign-in without a next page goes.
    CsrfToken:
      type: object
      required: [csrf]
      properties:
        csrf:
          type: string
          description: The session's CSRF token from now on.
    Created:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64

    # Page data (web-ssr.md section 5) and the viewer.
    Role:
      type: string
      enum: [superadmin, admin, member]
    Viewer:
      type: object
      description: >-
        What rendering needs to match the browser. The settings are the
        ones in effect, the account's own or the site's default, for a
        signed-out visitor too (web/docs/settings.md); one missing falls
        back to the client's built-in default. For a signed-out visitor
        account and nav are absent.
      required: [signed_in, now]
      properties:
        signed_in:
          type: boolean
        account:
          type: object
          required: [id, username, name, role]
          properties:
            id:
              type: integer
              format: int64
            username:
              type: string
            name:
              type: string
            role:
              $ref: '#/components/schemas/Role'
        now:
          type: string
          format: date-time
          description: The server's clock, for relative times.
        timezone:
          type: string
        date_format:
          type: string
          enum: [24h, 12h, iso]
        lang:
          type: string
          enum: [en, id]
        theme:
          type: string
          enum: [system, light, dark]
        sidebar:
          type: string
          enum: [open, collapsed]
          description: Whether the menu starts open or collapsed (the sidebar preference, else open).
        dashboard_numbers:
          type: string
          enum: [exact, compact]
          description: How the dashboard shows its figures (the dashboard_numbers preference, else exact).
        rows_per_page:
          type: integer
        nav:
          type: array
          description: The route ids of the pages the menu shows.
          items:
            type: string
        pinned:
          type: array
          items:
            type: object
            required: [id, title]
            properties:
              id:
                type: integer
                format: int64
              title:
                type: string
        chat:
          type: object
          properties:
            auto_load:
              type: boolean
            live:
              type: boolean
            media:
              type: string
              enum: [auto, click]
            show_deleted:
              type: boolean
            show_edited:
              type: boolean
            show_service:
              type: boolean
    PageBase:
      type: object
      required: [v, route, url, status, props, viewer]
      properties:
        v:
          type: integer
          const: 1
        route:
          type: string
        url:
          type: string
          description: The page's path and query string.
        status:
          type: integer
          enum: [200, 404]
        props:
          description: The route's page data; each Page variant names its schema.
        viewer:
          $ref: '#/components/schemas/Viewer'
    PageReload:
      type: object
      required: [reload]
      properties:
        reload:
          type: boolean
          const: true
    PageNotFound:
      allOf:
        - $ref: '#/components/schemas/PageBase'
        - type: object
          properties:
            route:
              const: not_found
            status:
              const: 404
            props:
              type: object
              additionalProperties: false
    PageAnswer:
      description: The page data; `route` says which props it carries.
      oneOf:
        - $ref: '#/components/schemas/PageLogin'
        - $ref: '#/components/schemas/PageDashboard'
        - $ref: '#/components/schemas/PageUsers'
        - $ref: '#/components/schemas/PageUser'
        - $ref: '#/components/schemas/PageGroups'
        - $ref: '#/components/schemas/PageGroup'
        - $ref: '#/components/schemas/PageFiles'
        - $ref: '#/components/schemas/PageMessages'
        - $ref: '#/components/schemas/PageMessage'
        - $ref: '#/components/schemas/PageChat'
        - $ref: '#/components/schemas/PageSettings'
        - $ref: '#/components/schemas/PagePreferences'
        - $ref: '#/components/schemas/PageSessions'
        - $ref: '#/components/schemas/PageAccounts'
        - $ref: '#/components/schemas/PageFederations'
        - $ref: '#/components/schemas/PageFederation'
        - $ref: '#/components/schemas/PageForwarding'
        - $ref: '#/components/schemas/PageT2D'
        - $ref: '#/components/schemas/PageD2T'
        - $ref: '#/components/schemas/PageBots'
        - $ref: '#/components/schemas/PageJoinChat'
        - $ref: '#/components/schemas/PageMcp'
        - $ref: '#/components/schemas/PageMcpGroups'
        - $ref: '#/components/schemas/PageMcpTokens'
        - $ref: '#/components/schemas/PageLinkPage'
        - $ref: '#/components/schemas/PagePasswordChange'
    PageLinkPage:
      allOf:
        - $ref: '#/components/schemas/PageBase'
        - type: object
          required: [route, props]
          properties:
            route:
              enum: [password_forgot, password_set, email_verify]
            props:
              type: object
              additionalProperties: false
    PagePasswordChange:
      allOf:
        - $ref: '#/components/schemas/PageBase'
        - type: object
          required: [route, props]
          properties:
            route:
              enum: [password_change]
            props:
              $ref: '#/components/schemas/PasswordChangeProps'
    PageLogin:
      allOf:
        - $ref: '#/components/schemas/PageBase'
        - type: object
          required: [route, props]
          properties:
            route:
              enum: [login]
            props:
              $ref: '#/components/schemas/LoginProps'
    PageDashboard:
      allOf:
        - $ref: '#/components/schemas/PageBase'
        - type: object
          required: [route, props]
          properties:
            route:
              enum: [dashboard]
            props:
              $ref: '#/components/schemas/DashboardProps'
    PageUsers:
      allOf:
        - $ref: '#/components/schemas/PageBase'
        - type: object
          required: [route, props]
          properties:
            route:
              enum: [users]
            props:
              $ref: '#/components/schemas/UsersProps'
    PageUser:
      allOf:
        - $ref: '#/components/schemas/PageBase'
        - type: object
          required: [route, props]
          properties:
            route:
              enum: [user, user_history]
            props:
              $ref: '#/components/schemas/UserProps'
    PageGroups:
