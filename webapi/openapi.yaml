components:

  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: tgw_session
      description: >-
        The signed session cookie, set by POST /api/login. Valid only
        while it has not expired and its session_epoch is the
        account's; sessions are shared with the Drogon web.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        The session's CSRF token, from GET /api/session, POST
        /api/login or the page's csrf-token meta tag. Required with the
        session on every state-changing request.
    loginCsrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: The pre-login token from GET /api/login.
    loginCookie:
      type: apiKey
      in: cookie
      name: tgw_csrf
      description: The pre-login cookie GET /api/login sets (path /api/login).
    apiToken:
      x-tgd-status: planned
      type: http
      scheme: bearer
      description: >-
        Planned, not accepted yet: per-account API tokens for clients
        that cannot keep cookies or CSRF tokens (native apps, scripts),
        web-accounts.md section 7. How they are issued and what they
        look like is not designed yet; until then the cookie session
        is the only authentication.

  headers:
    NoStore:
      description: no-store
      schema:
        type: string
    LoginCookie:
      description: tgw_csrf, the fresh pre-login token.
      schema:
        type: string
    AcceptRanges:
      description: bytes
      schema:
        type: string
    FileCacheControl:
      description: public, max-age=604800
      schema:
        type: string
    ContentDisposition:
      description: >-
        attachment; filename=<name>, for a file not shown inline
        (documents and the like).
      schema:
        type: string

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    GroupId:
      name: group_id
      in: path
      required: true
      description: The group's Telegram chat id.
      schema:
        type: integer
        format: int64
    ChatScope:
      name: scope
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MessageScope'

  responses:
    BadRequest:
      description: A malformed request (error bad_request).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: >-
        No valid session (error unauthenticated); a revoked session
        cookie is cleared.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SessionUnavailable:
      description: >-
        The session could not be checked against the database (error
        unavailable); the cookie is kept.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Csrf:
      description: >-
        The CSRF token is missing or wrong (error csrf), or a gate is
        up (see Gates in the description).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: >-
        No such thing, or one the viewer may not see (error not_found).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Gate:
      description: >-
        A gate is up (see Gates in the description): error
        password_change_required, later email_required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LastSuperadmin:
      description: >-
        The change would leave no active superadmin (error
        last_superadmin).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadWebhook:
      description: >-
        Not a Discord webhook URL (error bad_webhook), or another
        malformed request (error bad_request).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DaemonFailed:
      description: >-
        The daemon gave no outcome: its API is off or unreachable,
        TDLib is not ready, or Telegram did not answer in time (error
        daemon); message says what to do.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: Something failed on the server (error internal).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: A machine-readable code (csrf, not_found, ...).
        message:
          type: string
          description: A sentence for a person to read, where there is one.
    FieldError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            field:
              type: string
              description: The key whose value was refused, when one was.
    LoginError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [message, csrf]
          properties:
            message:
              type: string
            csrf:
              type: string
              description: A fresh pre-login token, to try again with.
    Health:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          required: [ro, app]
          properties:
            ro:
              type: string
              enum: [ok, unavailable]
            app:
              type: string
              enum: [ok, unavailable]
    LoginState:
      type: object
      required: [signed_in]
      properties:
        signed_in:
          type: boolean
        csrf:
          type: string
          description: The pre-login token; only when signed_in is false.
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    SessionUser:
      type: object
      required: [id, username, role, must_change_password]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        must_change_password:
          type: boolean
          description: >-
            The account signed in with a temporary password and must
            choose its own (POST /api/account/password) before anything
            else; see Gates in the description.
    Session:
      type: object
      required: [user, csrf]
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
        csrf:
          type: string
          description: The session's CSRF token.
        landing:
          type: string
          description: >-
            The account's landing page (its preference, else /): where a
            sign-in without a next page goes.
    CsrfToken:
      type: object
      required: [csrf]
      properties:
        csrf:
          type: string
          description: The session's CSRF token from now on.
    Created:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64

    # Page data (web-ssr.md section 5) and the viewer.
    Role:
      type: string
      enum: [superadmin, admin, member]
    Viewer:
      type: object
      description: >-
        What rendering needs to match the browser. The settings are the
        ones in effect, the account's own or the site's default, for a
        signed-out visitor too (web/docs/settings.md); one missing falls
        back to the client's built-in default. For a signed-out visitor
        account and nav are absent.
      required: [signed_in, now]
      properties:
        signed_in:
          type: boolean
        account:
          type: object
          required: [id, username, name, role]
          properties:
            id:
              type: integer
              format: int64
            username:
              type: string
            name:
              type: string
            role:
              $ref: '#/components/schemas/Role'
        now:
          type: string
          format: date-time
          description: The server's clock, for relative times.
        timezone:
          type: string
        date_format:
          type: string
          enum: [24h, 12h, iso]
        lang:
          type: string
          enum: [en, id]
        theme:
          type: string
          enum: [system, light, dark]
        sidebar:
          type: string
          enum: [open, collapsed]
        rows_per_page:
          type: integer
        nav:
          type: array
          description: The route ids of the pages the menu shows.
          items:
            type: string
        pinned:
          type: array
          items:
            type: object
            required: [id, title]
            properties:
              id:
                type: integer
                format: int64
              title:
                type: string
        chat:
          type: object
          properties:
            auto_load:
              type: boolean
            live:
              type: boolean
            media:
              type: string
              enum: [auto, click]
            show_deleted:
              type: boolean
            show_edited:
              type: boolean
            show_service:
              type: boolean
    PageBase:
      type: object
      required: [v, route, url, status, props, viewer]
      properties:
        v:
          type: integer
          const: 1
        route:
          type: string
        url:
          type: string
          description: The page's path and query string.
        status:
