              $ref: '#/components/schemas/GroupsProps'
    PageGroup:
      allOf:
        - $ref: '#/components/schemas/PageBase'
        - type: object
          required: [route, props]
          properties:
            route:
              enum: [group, group_admins, group_history]
            props:
              $ref: '#/components/schemas/GroupProps'
    PageFiles:
      allOf:
        - $ref: '#/components/schemas/PageBase'
        - type: object
          required: [route, props]
          properties:
            route:
              enum: [files]
            props:
              $ref: '#/components/schemas/FilesProps'
    PageMessages:
      allOf:
        - $ref: '#/components/schemas/PageBase'
        - type: object
          required: [route, props]
          properties:
            route:
              enum: [group_messages, private_messages]
            props:
              $ref: '#/components/schemas/MessagesProps'
    PageMessage:
      allOf:
        - $ref: '#/components/schemas/PageBase'
        - type: object
          required: [route, props]
          properties:
            route:
              enum: [message]
