# SPDX-License-Identifier: GPL-2.0-or-later
#
# The API contract of the Go web service (webapi/). Every route the
# service serves is described here, and every operation described is
# served unless it carries `x-tgd-status: planned`;
# internal/server/openapi_test.go checks both. The React application
# generates its client from this file (web/app, `npm run gen:api`).
#
# The test reads the file with a small reader of its own, so keep to
# this layout: two-space indentation, block mappings, sequences
# indented under their key, flow collections ([a, b], {}) on one line,
# and long text as a block scalar (>- or |), never a plain scalar
# continued on the next line.
openapi: 3.1.0
info:
  title: tgloggerd web API
  version: 0.1.0
  license:
    name: GPL-2.0-or-later
    identifier: GPL-2.0-or-later
  description: >-
    The JSON API of the tgloggerd web service, and the file URLs it
    serves. The React dashboard is one client of it; every feature of
    the dashboard that reads from or acts on the backend is an
    operation here, so other clients can do the same through the same
    operations and the same request scope (docs/design/web-go.md
    section 6).


    Operations marked `x-tgd-status: planned` are designed but not
    served yet; until they are, they answer 404 like any unknown
    path. Their shapes follow the React pages that already call them
    and docs/design/web-accounts.md, and may still change when they
    are built.


    Authentication is the browser session: the signed cookie
    tgw_session, set by POST /api/login. Every state-changing request
    carries a CSRF token in the X-CSRF-Token header: for a signed-in
    request the token GET /api/session or POST /api/login answers; for
    POST /api/login the pre-login token of GET /api/login. A signed-in
    page also carries the session's token in its csrf-token meta tag.
    Per-account bearer tokens for clients that cannot keep cookies
    (native apps, scripts) are planned (web-accounts.md section 7); see
    the apiToken scheme.


    Errors of the JSON operations are an object with a machine-readable
    `error` code and, where a person may read it, a `message`
    sentence (the Error schema). Visibility follows the request scope
    of web-accounts.md section 9: something the viewer may not see
    answers exactly like something that does not exist, 404
    not_found, never 403. A forbidden action on something the viewer
    may see answers 403 forbidden.


    Gates: an account that signed in with a temporary password
    (SessionUser.must_change_password) must choose its own first
    (decisions/2026-11-18-temporary-passwords.md). Until it does,
    every operation that needs a session answers 403
    password_change_required, except GET /api/session, POST
    /api/logout and POST /api/account/password; page data answers the
    password_change route. The email gate (email_required) works the
    same way once accounts have verified addresses.
servers:
  - url: /
security:
  - session: []
tags:
  - name: service
    description: Health of the service.
  - name: auth
    description: Signing in and out, the current session.
  - name: files
    description: File bytes behind /files/<token> links.
  - name: pages
    description: Page data for the React application (docs/design/web-ssr.md).
  - name: chats
    description: Chat message windows and the chat search of the pickers.
  - name: account
    description: The signed-in account's own settings.
  - name: accounts
    description: Administration of accounts and federations.
  - name: forwarding
    description: Telegram to Discord and Discord to Telegram forwarding.
  - name: join-chat
    description: Joining Telegram groups and channels with the logging account.
  - name: mcp
    description: Administration of the MCP endpoint's exposed groups and tokens.
  - name: live
    description: Live updates as Server-Sent Events.
  - name: search
    description: The advanced search over the logged users, groups, files and messages.

paths:

  /api/health:
    get:
      operationId: getHealth
      tags: [service]
      summary: Check both database pools
      description: >-
        Needs no session; for probes and for checking the routing. The
        answer says only which pool failed; the reason goes to the
        service's log.
      security: []
      responses:
        '200':
          description: Both pools answer.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: >-
            A pool did not answer within a few seconds; its check reads
            "unavailable" and so does status.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/login:
    get:
      operationId: getLogin
      tags: [auth]
      summary: Start a sign-in
      description: >-
        Answers a pre-login CSRF token and sets it as the tgw_csrf
        cookie (path /api/login), to be sent back with POST
        /api/login. A request whose session cookie has a valid
        signature gets signed_in true and no token; the cookie's
        session_epoch is not checked here, as the Drogon login page
        does not check it either.
      security: []
      responses:
        '200':
          description: The sign-in state, and a token when signed out.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: tgw_csrf, the pre-login token, when signed_in is false.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginState'
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      description: >-
        Checks, in this order: the pre-login CSRF token against its
        cookie, the body, the login throttle (per client address and
        username, in the process's memory), then the account and its
        password. Each attempt past the CSRF check and the body is
        audited (login_ok, login_fail or login_ratelimited). Refused
        attempts answer a fresh pre-login token in `csrf` and set it as
        the cookie, so the client can try again.
      security:
        - loginCsrf: []
          loginCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in; the session cookie is set.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: tgw_session, the signed session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: The body is not a JSON object (error bad_request).
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: >-
            No such account, a disabled one, or a wrong password (error
            invalid_credentials), with a fresh token.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/LoginCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError'
        '403':
          description: >-
            The token or its cookie is missing or wrong (error csrf),
            with a fresh token.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/LoginCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError'
        '429':
          description: >-
            Too many failures for this address and username within the
            throttle's window (error rate_limited), with a fresh token.
            No Retry-After is sent.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/LoginCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError'
        '500':
          $ref: '#/components/responses/Internal'

  /api/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out this browser
      description: >-
        Clears the session cookie, ends the session's record, so a copy
        of the cookie stops working on both web services, and audits a
        logout when the cookie opens. The account's other sessions stay
        signed in. The CSRF
        token must match the session cookie; a request without a
        session cookie fails that check.
      security:
        - session: []
          csrf: []
      responses:
        '204':
          description: Signed out; the session cookie is cleared.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: tgw_session, expired.
              schema:
                type: string
        '403':
          description: The CSRF token is missing or wrong (error csrf).
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'

  /api/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Who is signed in
      description: >-
        The account of a valid session (signature, expiry, the
        account's session_epoch, and an account that is not disabled)
        and the CSRF token to send with it. The role is the account's
        current one, read on every request, not the one the cookie was
        issued with.
      responses:
        '200':
          description: The session's account and CSRF token.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /files/{token}:
    get:
      operationId: getFile
      tags: [files]
      summary: A file's bytes
      description: >-
        Serves a logged file, from the store or fetched from Telegram
        through the daemon; web/docs/media.md has the details. The
        token is the encrypted file id; one that does not open answers
        like an unknown id. The route is public: a session only allows
        fetching big files and makes the request audited. HEAD is
        answered like GET, without the body.


        Error answers are small HTML pages, not JSON, since a browser
        following a link or loading an image gets them.
      security:
        - {}
        - session: []
      parameters:
        - name: token
          in: path
          required: true
          description: The file token, as minted into the pages and the API.
          schema:
            type: string
        - name: Range
          in: header
          required: false
          description: >-
            A byte range. A stored file honours several ranges
            (multipart/byteranges); a partial file from TDLib's cache
            answers at most the bytes it holds from the first range's
            start.
          schema:
            type: string
        - name: If-Range
          in: header
          required: false
          schema:
            type: string
        - name: If-Modified-Since
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The whole file.
          headers:
            Accept-Ranges:
              $ref: '#/components/headers/AcceptRanges'
            Cache-Control:
              $ref: '#/components/headers/FileCacheControl'
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
            Last-Modified:
              description: For a stored file.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '206':
          description: >-
            The requested range, or for a file still being fetched the
            part of it already there; Content-Range carries the file's
            full size.
          headers:
            Accept-Ranges:
              $ref: '#/components/headers/AcceptRanges'
            Cache-Control:
              $ref: '#/components/headers/FileCacheControl'
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
            multipart/byteranges:
              schema:
                type: string
        '304':
          description: Not modified since If-Modified-Since (a stored file).
        '403':
          description: >-
            Not in the store and too big to fetch without a session
            ("Sign in to load this file").
          content:
            text/html:
              schema:
                type: string
        '404':
          description: >-
            No such file, a token that does not open, or not in the
            store while fetching from Telegram is not configured.
          content:
            text/html:
              schema:
                type: string
        '410':
          description: The file is no longer available on Telegram.
          content:
            text/html:
              schema:
                type: string
        '416':
          description: The range is outside the file.
          headers:
            Content-Range:
              description: bytes */<size>, when the size is known.
              schema:
                type: string
        '500':
          description: The file could not be served.
          content:
            text/html:
              schema:
                type: string
        '502':
          description: The daemon answered something unexpected.
          content:
            text/html:
              schema:
                type: string
        '503':
          description: >-
            The daemon is busy, unreachable or not signed in to
            Telegram, or the file moved while it was being opened; try
            again after Retry-After seconds.
          headers:
            Retry-After:
              description: Seconds to wait before asking again.
              schema:
                type: integer
          content:
            text/html:
              schema:
                type: string
        '504':
          description: >-
            Telegram took too long; the fetch goes on in the background.
          content:
            text/html:
              schema:
                type: string

  /api/events:
    get:
      operationId: getEvents
      tags: [live]
      summary: Live updates as Server-Sent Events
      description: >-
        What changes in the archive, as a text/event-stream for as long
        as the connection stays open (docs/design/web-live.md). An
        event says what changed, never the new content; the page
        refetches what it names through the other operations. Only
        events about chats and users the viewer may see are sent, so
        the stream reveals no activity in a hidden group.


        Framing: a `retry:` line first, then one frame per event with
        `id:` its seq, `event:` its kind and `data:` the LiveEvent as
        JSON. The first event is a `hello` (the events after its seq
        follow) or a `resync` (what the client missed cannot be sent:
        refetch what is shown, the events after its seq follow). A
        `resync` can also come later, when the client reads too slowly
        to keep up. A comment line (`: keepalive`) about every 15
        seconds keeps a quiet stream alive. A `session` event, without
        an id, ends the stream when the session was revoked or expired
        (reason revoked: sign in again) or the viewer's access changed
        (reason scope_changed: refetch everything, then reconnect).
        The server also closes the stream without an event when the
        daemon stays away; reconnecting then answers 503.


        To resume, reconnect with the last seq seen, as `last` or as
        the Last-Event-ID header the browser sends on its own
        reconnect (the header wins). Recent events are kept, so a
        short disconnect loses nothing; a longer one, or one across a
        restart of the daemon, starts with a resync.


        Topics: `chat:<chat_id>` (message.new, message.edited,
        message.deleted and file.stored of one chat), `messages` (the
        same for every chat the viewer may see), `user:<id>`
        (user.updated), `group:<chat_id>` (group.updated) and `stats`
        (stats.changed). Repeats count once; at most 2000 topics, and
        the request line may run to tens of kilobytes. Kinds may be
        added; a client skips kinds it does not know.
      parameters:
        - name: topics
          in: query
          required: true
          description: >-
            Comma-separated topics, e.g.
            chat:-1001234567890,user:42,messages,stats.
          schema:
            type: string
        - name: last
          in: query
          required: false
          description: The last seq the client has seen; without it the stream starts from now.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: Last-Event-ID
          in: header
          required: false
          description: >-
            Set by the browser's EventSource on its own reconnect;
            wins over last. A value that is not a seq resumes nothing
            (a resync).
          schema:
            type: string
      responses:
        '200':
          description: >-
            The stream. Each frame's data is a LiveEvent, as JSON.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Accel-Buffering:
              description: no, so nginx passes each frame on at once.
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
              x-tgd-event:
                $ref: '#/components/schemas/LiveEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          description: >-
            No stream: live updates are off or the daemon's stream is
            not connected (error live_off), too many streams are open
            (error unavailable), or the session could not be checked
            (error unavailable). The client polls meanwhile and tries
            again after Retry-After seconds.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/page/{path}:
    get:
      operationId: getPage
      tags: [pages]
      summary: A page's data
      description: >-
        The data of the page at /<path>, the same object the server
        embeds in the page's HTML on a first load (web-ssr.md sections
        5 and 7), for navigation in the browser. `path` is the page's
        path without its leading slash (empty for the dashboard at /);
        its slashes may be sent as they are or encoded as %2F. The
        page's query string (search, filters, sort, page) is passed on
        as the query string of this request.


        The route ids and their page paths:
        login /login;
        dashboard /;
        users /users;
        user /users/{id};
        user_history /users/{id}/history;
        user_chat /users/{id}/chat;
        groups /groups;
        group /groups/{id};
        group_admins /groups/{id}/admins;
        group_history /groups/{id}/history;
        group_chat /groups/{id}/chat;
        files /files;
        group_messages /group_messages;
        private_messages /private_messages;
        message /messages/{group|private}/{id};
        settings /settings;
        settings_preferences /settings/preferences;
        settings_sessions /settings/sessions;
        accounts /settings/accounts;
        federations /settings/federations;
        platform_fwd /platform-fwd;
        fwd_telegram_discord /platform-fwd/telegram-discord;
        fwd_discord_telegram /platform-fwd/discord-telegram;
        join_chat /join-chat;
        mcp /mcp-admin;
        mcp_groups /mcp-admin/groups;
        mcp_tokens /mcp-admin/tokens;
        password_forgot /password/forgot;
        password_set /password/set;
        email_verify /account/email/verify.


        password_forgot, password_set and email_verify are served to
        signed-out and signed-in visitors alike, and their GETs change
        nothing: the link token travels in the URL's fragment, which
        never reaches the server, and is posted only when the person
        acts on the page.


        A signed-in account that must change its temporary password
        gets the password_change route for every page path, before the
        email gate, until it has chosen its own.


        A signed-in account with no verified email address
        (web-accounts.md section 8) gets the email_required route for
        every page path except those three, until an address is
        verified; its API operations answer 403 email_required, except
        session, logout, the account's email operations and the three
        link operations.


        A path the service does not serve as a React page yet answers
        {"reload": true}, and the browser loads it in full. Something
        the viewer may not see answers 404 with the not_found route,
        exactly like something that does not exist; so does a path that
        is no page at all. A signed-out visitor gets 401 for every path
        but login, the three link pages and the public chats of exposed
        groups (group_chat).


        So far the service loads the data of login, dashboard, user,
        user_history, user_chat, group, group_admins, group_history,
        group_chat and message, and of the list pages users, groups,
        files, group_messages and private_messages (and not_found);
        every other route answers {"reload": true}. A signed-out
        visitor asking for the group_chat of a group that is not
        exposed is asked to sign in (401 here, the redirect for the
        document), whether or not the group exists. A list page reads
        its list state from its query string (q, f the filters as a
        JSON array of Cond, sort, dir, page, per) through the advanced
        search (searchEntity) and the request scope; filters it does
        not take are dropped and not echoed in conds, and archive_total
        is there only for a viewer who sees the whole archive of that
        list. The page's document
        (its HTML, web-ssr.md section 5) is served at the page's own
        path for each route whose data the service loads, and there a
        signed-out visitor asking for a page that needs a session is
        redirected (302) to /login?next=<path and query>.
      security:
        - {}
        - session: []
      parameters:
        - name: path
          in: path
          required: true
          description: The page's path without the leading slash.
          schema:
            type: string
        - name: query
          in: query
          required: false
          description: The page's own query string, passed on unchanged.
          style: form
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
      responses:
        '200':
          description: The page data, or a request to load the page in full.
          headers:
            Cache-Control:
              description: >-
                public, max-age=60 for a public page asked for without a
                session cookie; private, no-store otherwise, and for
                {"reload": true}.
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PageAnswer'
                  - $ref: '#/components/schemas/PageReload'
        '401':
          description: >-
            The page needs a session and the request has none (error
            unauthenticated); the browser loads the page in full and
            lands on the sign-in page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such page or nothing the viewer may see.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageNotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /app/assets/{file}:
    get:
      operationId: getAsset
      tags: [pages]
      summary: A file of the client bundle
      description: >-
        The content-hashed files vite build wrote to the bundle's
        assets/ directory (WEBAPI_APP_DIST), which page documents link
        (web-ssr.md section 6). Nothing outside that directory is
        served.
      security: []
      parameters:
        - name: file
          in: path
          required: true
          description: The file's path under assets/.
          schema:
            type: string
      responses:
        '200':
          description: The file.
          headers:
            Cache-Control:
              description: public, max-age=31536000, immutable
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: No such file, or no bundle.
          content:
            text/plain:
              schema:
                type: string

  /api/chats/{scope}/{id}/messages:
    get:
      operationId: getChatMessages
      tags: [chats]
      summary: A window of a chat's messages
      description: >-
        Messages of a group or a private chat, oldest first, for
        scrolling and live updates. At most one of before, after and
        around is given; with none the window is the newest messages.
        Replaces the Drogon /v1/chats/{scope}/{id}/messages with the
        message shape of the chat pages; the cursors are the same
        message ids, and limit is clamped to 1..100 as there.


        Messages sent as an album (consecutive rows sharing a media
        album id) come as one message: the first item's ids, date and
        sender, its media as `media` and the other items' as `album`,
        the caption and edits of the item that has one. A window whose
        edge cuts an album is extended to hold all of it, so an album
        always folds the same way; a window after an album's own
        message id therefore starts with that album again, which a
        client drops by `id`.


        Visibility: a group the viewer's scope sees, or any exposed
        group (MCP exposure), whose chat is public; a private chat to a
        viewer that sees private messages. A signed-out visitor may
        read the chats of exposed groups and gets 401 for anything
        else, whether it exists or not; a signed-in viewer gets 404 for
        what it may not see. A reply quotes a message of another chat
        only when the viewer sees that chat (reply_to.chat_id names
        it); otherwise reply_to is null. Senders are shown in full
        (counts, contact name) only to viewers that see all users.
      security:
        - {}
        - session: []
      parameters:
        - $ref: '#/components/parameters/ChatScope'
        - name: id
          in: path
          required: true
          description: The group's chat id, or the user's id for a private chat.
          schema:
            type: integer
            format: int64
        - name: before
          in: query
          required: false
          description: Messages older than this message id.
          schema:
            type: integer
            format: int64
        - name: after
          in: query
          required: false
          description: Messages newer than this message id.
          schema:
            type: integer
            format: int64
        - name: around
          in: query
          required: false
          description: Messages around this message id, which is included.
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 60
      responses:
        '200':
          description: The window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatWindow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Gate'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/chats/search:
    get:
      operationId: searchChats
      tags: [chats]
      summary: Search chats for a picker
      description: >-
        Groups and private chats the viewer may see whose title, name
        or username matches q (a leading @ is ignored, and a number
        also matches the chat's id exactly); an empty q lists every
        one. Busiest first: groups by their message count, private
        chats by the number of their messages. Without kind both kinds
        are searched. A member, or an admin restricted from private
        messages, gets groups only (web-accounts.md sections 4 and 5),
        and only the groups the request scope shows. federation limits
        the answer to that federation's groups (0 is Default, which
        holds every group until federations exist; any other id holds
        none yet). Paged by an opaque cursor, at most 100000 rows deep.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [group, user]
        - name: federation
          in: query
          required: false
          description: Only the groups of this federation; 0 is Default.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - name: cursor
          in: query
          required: false
          description: The next_cursor of the previous page.
          schema:
            type: string
      responses:
        '200':
          description: A page of matches; next_cursor is null on the last.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSearchPage'
        '400':
          description: >-
            A malformed kind, limit, federation or cursor, or a q over
            512 bytes (error bad_request); or a search that ran out of
            time (error search_timeout).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Gate'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/search/{entity}:
    get:
      operationId: searchEntity
      tags: [search]
      summary: Advanced search over one entity
      description: >-
        The advanced search of web/docs/search-api.md: a flat chain of
        conditions over the entity's field registry, sorted and paged,
        with the rows as arrays aligned to `cols`. The same parameters
        and the same answer as the Drogon web's GET /v1/search/{entity},
        which it ports; it is under /api/ like the rest of this
        service, while the Drogon pages keep calling their own until
        they move here.


        Everything is read through the request scope. Private messages
        do not exist (404) for a viewer who may not see private chats.
        The other entities' rows are limited in the query itself, so
        rows, totals and estimates count only what the viewer may see:
        a member sees the users of its visible groups by id, name,
        username, type and photo only (`fields` and `cols` shrink to
        those), and the files and messages of its visible groups. A
        total is the storage engine's estimate of a whole table
        (total_exact false) only for a viewer who sees that whole
        table.


        String cells are HTML-escaped, as Drogon sends them; photo
        cells are /files/<token> URLs, or "" for none.
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
            enum: [users, groups, files, private_messages, group_messages]
        - name: search
          in: query
          required: false
          description: >-
            A JSON array of conditions {c, o, v, n} (field key,
            operator, value, connector AND or OR to the next one), at
            most 8 KB; empty is every row.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Read as C's atoi and clamped to 1 to 1000.
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          required: false
          description: Read as C's atoi and clamped to 0 to 500000.
          schema:
            type: integer
            default: 0
        - name: sort
          in: query
          required: false
          description: >-
            A sortable field key; anything else is the default order.
            Without one, a search with a fulltext condition is ordered
            by relevance.
          schema:
            type: string
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
        - name: debug
          in: query
          required: false
          description: >-
            1 adds the SQL, its values and its plan, for superadmins
            and admins; it is ignored for anyone else.
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: A page of rows.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAnswer'
        '400':
          description: >-
            A search the registry refuses (error bad_search: an unknown
            field, an operator the field does not take, a malformed
            value or JSON, too many conditions), or one that ran out of
            time (error search_timeout); message is Drogon's sentence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Gate'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/entities:
    get:
      operationId: getEntities
      tags: [chats]
      summary: Current names, photos and counts of users and groups
      description: >-
        The current summaries of the users and groups a page shows, for
        the browser's entity cache: lists render names, photos and
        counts from it, and a user.updated, group.updated or
        stats.changed live event makes it ask again for the ids the
        event names. Only what the viewer may see is answered, through
        the same request scope as everything else: an id that is
        hidden from the viewer, or unknown, is left out, and the answer
        never says which. Counts follow the scope too (a member gets
        none, web-accounts.md section 5). At most 200 ids per list.
      parameters:
        - name: users
          in: query
          required: false
          description: Comma-separated user ids.
          schema:
            type: string
        - name: groups
          in: query
          required: false
          description: Comma-separated group chat ids.
          schema:
            type: string
      responses:
        '200':
          description: The visible ones among the ids asked for.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entities'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/account/password:
    post:
      operationId: changePassword
      tags: [account]
      summary: Change the password
      description: >-
        Every other session of the account ends (its session_epoch
        moves on), on both web services. This one is issued a new
        session cookie, which changes its CSRF token: the answer
        carries the new one. It also ends a forced change after a
        temporary password, and is served while that gate is up. The
        new password must differ from the current one. Wrong current
        passwords are throttled per account like sign-ins. Audited as
        password_change or password_change_fail.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  description: At least the minimum length; no maximum below the body limit.
      responses:
        '200':
          description: Changed; a new session cookie is set.
          headers:
            Set-Cookie:
              description: tgw_session, reissued.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '400':
          description: >-
            A wrong current password (error wrong_password), a new one
            shorter than 8 bytes or equal to the current one (error
            weak_password), or a malformed body (error bad_request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '429':
          description: Too many wrong current passwords (error rate_limited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/account/email:
    post:
      x-tgd-status: planned
      operationId: changeEmail
      tags: [account]
      summary: Change the email address
      description: >-
        Sends a verification link to the new address, which is used
        only once verified, and a notice to the old one
        (web-accounts.md section 8).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '202':
          description: The verification link is on its way.
        '400':
          description: >-
            A wrong password (error wrong_password), an address that is
            not one (error bad_email), or a malformed body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/account/email/verify:
    post:
      x-tgd-status: planned
      operationId: verifyEmail
      tags: [account]
      summary: Verify an email address
      description: >-
        Takes the token of a verification link (web-accounts.md
        section 8), <site>/account/email/verify#token=<token>. Links
        are single-use and expire. Needs no session: the link may be
        opened in another browser.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '204':
          description: The address is verified.
        '400':
          description: The link is unknown, used or expired (error bad_link).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/password/forgot:
    post:
      x-tgd-status: planned
      operationId: forgotPassword
      tags: [account]
      summary: Ask for a password reset link
      description: >-
        Sends a one-time reset link to the account's verified address
        (web-accounts.md section 8). The answer is the same whether or
        not such an account exists. Carries the pre-login CSRF token of
        GET /api/login, like a sign-in.
      security:
        - loginCsrf: []
          loginCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  description: The account's username or email address.
      responses:
        '202':
          description: A link is sent if the account has a verified address.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Csrf'
        '429':
          description: Too many requests (error rate_limited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/password/set:
    post:
      x-tgd-status: planned
      operationId: setPassword
      tags: [account]
      summary: Set a password from a link
      description: >-
        Takes the token of a set-password link (a new account's
        invitation, or a reset), <site>/password/set#token=<token>, and
        the new password. Every session of the account ends.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                new_password:
                  type: string
      responses:
        '204':
          description: The password is set; the account can sign in with it.
        '400':
          description: >-
            The link is unknown, used or expired (error bad_link), or
            the password is too short (error weak_password).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/account/preferences:
    get:
      operationId: getPreferences
      tags: [account]
      summary: The account's preferences, pins and saved searches
      description: >-
        The preferences page's data: the preferences as stored (null is
        the site default), the time zones offered (any IANA zone is
        accepted), the landing pages the viewer may open, its pinned
        groups that it may see and its saved searches.
      responses:
        '200':
          description: The preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesProps'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/SessionUnavailable'
    put:
      operationId: putPreferences
      tags: [account]
      summary: Save the account's preferences
      description: >-
        Replaces every preference; null (or a missing field) is the
        site default. A field that is not a preference, or a value its
        key does not take, refuses the whole body with 400 bad_request
        naming the key in `field`: timezone an IANA zone name,
        date_format 24h, 12h or iso, lang en or id, theme system, light
        or dark, rows_per_page 25, 50 or 100, landing a path on this
        site (one leading slash, at most 255 bytes), chat_media auto or
        click, the chat_* switches booleans. The viewer of the next page
        data carries the settings in effect (web/docs/settings.md).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Prefs'
      responses:
        '200':
          description: The saved preferences.
          content:
            application/json:
              schema:
                type: object
                required: [prefs]
                properties:
                  prefs:
                    $ref: '#/components/schemas/Prefs'
        '400':
          description: A malformed body, an unknown key or a refused value (error bad_request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/account/pinned/{group_id}:
    put:
      operationId: pinGroup
      tags: [account]
      summary: Pin a group
      description: >-
        Pins a group the viewer may see to the top of its menu
        (Viewer.pinned), after the ones pinned before. A group that
        does not exist or that the request scope hides answers 404. An
        account keeps at most 50 pins (400 too_many); a pin of a group
        the viewer can no longer see is kept, counts, and shows nowhere.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '204':
          description: Pinned (also when it already was; it keeps its place).
        '400':
          description: The account has 50 pins already (error too_many).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: unpinGroup
      tags: [account]
      summary: Unpin a group
      description: >-
        404 when the group is not pinned, or when the request scope
        hides it, like a group that does not exist.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '204':
          description: Unpinned.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/account/saved-searches:
    post:
      operationId: saveSearch
      tags: [account]
      summary: Save a search
      description: >-
        title is trimmed and must keep 1 to 128 characters; url must be
        a path on this site (one leading slash, no backslash or control
        character) of at most 2048 bytes. Otherwise 400 bad_request
        names the field. An account keeps at most 100 (400 too_many).
        The preferences page lists them.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, url]
              properties:
                title:
                  type: string
                url:
                  type: string
                  description: The search page's path and query string.
      responses:
        '201':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Created'
        '400':
          description: >-
            A refused title or url (error bad_request, with field), or
            the account has 100 already (error too_many).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'

  /api/account/saved-searches/{id}:
    delete:
      operationId: deleteSavedSearch
      tags: [account]
      summary: Delete a saved search
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/account/sessions:
    get:
      operationId: listSessions
      tags: [account]
      summary: The account's sessions
      description: >-
        Every live session of the account, this one first, then by last
        use: the sessions page's data (web/docs/settings.md). A session
        signed in on the Drogon web is listed once it has reached this
        service. device is a short description of the browser's
        User-Agent, ip the address of its last use, place empty (no
        location source yet); started and last are UTC.
      responses:
        '200':
          description: The sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsProps'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/account/sessions/{id}:
    delete:
      operationId: endSession
      tags: [account]
      summary: Sign out one of the account's other sessions
      description: >-
        That session ends on both web services. Ending this browser's
        own session signs it out and clears its cookie. An id that is
        not one of the account's live sessions answers 404.
      security:
        - session: []
          csrf: []
      parameters:
        - name: id
          in: path
          required: true
          description: The session's id from the sessions page.
          schema:
            type: string
      responses:
        '204':
          description: That session is signed out.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/account/sessions/sign-out-others:
    post:
      operationId: endOtherSessions
      tags: [account]
      summary: Sign out every other session of the account
      description: >-
        Every other session ends on both web services, listed or not,
        as after a password change. This one stays signed in with a new
        cookie, and its CSRF token changes: send the answered one from
        now on.
      security:
        - session: []
          csrf: []
      responses:
        '200':
          description: Every other session is signed out; this one stays.
          headers:
            Set-Cookie:
              description: tgw_session, reissued.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'

  /api/accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: The accounts the viewer manages
      description: >-
        A superadmin gets every account, an admin the members of its
        federations (until federations exist, every member), by
        username (web-accounts.md sections 2 and 3). To a member the
        accounts administration does not exist (404).
      parameters:
        - name: role
          in: query
          required: false
          description: Only accounts of this role.
          schema:
            $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: The accounts.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountRow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Gate'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Create an account
      description: >-
        A superadmin creates any role. An admin creates members only,
        and must file them in at least one federation it administers
        (grants), since it manages only the members of its federations
        (web-accounts.md sections 2 and 3).


        Until set-password links exist (web-email), the new account
        gets a random temporary password, answered once here and never
        stored or logged in plain text, which it must replace at its
        first sign-in (decisions/2026-11-18-temporary-passwords.md;
        see Gates). When links arrive, creation sends one instead and
        temporary_password goes.


        Until federations exist (web-federations), Default (fed 0) is
        the only federation, every superadmin and admin administers it,
        and groups cannot be granted (web-member-access): a grant is
        {"fed": 0, "group_ids": []}. Audited as account_create, without
        the password.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
      responses:
        '201':
          description: Created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCreated'
        '400':
          description: >-
            A malformed body or role (error bad_request), a username
            that is not 1 to 64 letters, digits, dots, dashes or
            underscores starting with a letter or digit (bad_username),
            a name over 128 characters or with control characters
            (bad_name), not an address (bad_email), an admin's member
            without grants (grants_required), or groups in a grant
            (not_supported).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: >-
            The CSRF token is wrong (error csrf), the role or a
            federation is not the viewer's to give (error forbidden),
            or a gate is up (see Gates).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The username is taken (error taken), or the address is
            another account's (error email_taken).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/accounts/{id}:
    get:
      operationId: getAccount
      tags: [accounts]
      summary: One account the viewer manages
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The account as the accounts page shows it.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRow'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Gate'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'
    patch:
      operationId: updateAccount
      tags: [accounts]
      summary: Change an account
      description: >-
        Changes the fields given: name, email and role. A role change
        ends the account's sessions on both services. admin_of and
        restrict are a superadmin's to send; until federations, admin
        restrictions and member grants and abilities exist, they are
        accepted only as what they are today (admin_of [] or [0],
        restrictions all off, grants to fed 0 with no groups, no
        abilities) and anything else answers 400 not_supported, so the
        accounts page can send its whole form. A changed address is
        recorded; it is verified by a link once web-email exists.
        Audited as account_update, naming the fields changed.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatch'
      responses:
        '200':
          description: The account as the accounts page shows it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRow'
        '400':
          description: >-
            A malformed body or role (error bad_request), bad_name,
            bad_email, or a field that cannot be set yet
            (not_supported).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: >-
            The CSRF token is wrong (error csrf), the change is not
            the viewer's to make (error forbidden), or a gate is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The change would demote the last active superadmin (error
            last_superadmin), or the address is another account's
            (error email_taken).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

