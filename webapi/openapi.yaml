# SPDX-License-Identifier: GPL-2.0-or-later
#
# The API contract of the Go web service (webapi/). Every route the
# service serves is described here, and every operation described is
# served unless it carries `x-tgd-status: planned`;
# internal/server/openapi_test.go checks both. The React application
# generates its client from this file (web/app, `npm run gen:api`).
#
# The test reads the file with a small reader of its own, so keep to
# this layout: two-space indentation, block mappings, sequences
# indented under their key, flow collections ([a, b], {}) on one line,
# and long text as a block scalar (>- or |), never a plain scalar
# continued on the next line.
openapi: 3.1.0
info:
  title: tgloggerd web API
  version: 0.1.0
  license:
    name: GPL-2.0-or-later
    identifier: GPL-2.0-or-later
  description: >-
    The JSON API of the tgloggerd web service, and the file URLs it
    serves. The React dashboard is one client of it; every feature of
    the dashboard that reads from or acts on the backend is an
    operation here, so other clients can do the same through the same
    operations and the same request scope (docs/design/web-go.md
    section 6).


    Operations marked `x-tgd-status: planned` are designed but not
    served yet; until they are, they answer 404 like any unknown
    path. Their shapes follow the React pages that already call them
    and docs/design/web-accounts.md, and may still change when they
    are built.


    Authentication is the browser session: the signed cookie
    tgw_session, set by POST /api/login. Every state-changing request
    carries a CSRF token in the X-CSRF-Token header: for a signed-in
    request the token GET /api/session or POST /api/login answers; for
    POST /api/login the pre-login token of GET /api/login. A signed-in
    page also carries the session's token in its csrf-token meta tag.
    Per-account bearer tokens for clients that cannot keep cookies
    (native apps, scripts) are planned (web-accounts.md section 7); see
    the apiToken scheme.


    Errors of the JSON operations are an object with a machine-readable
    `error` code and, where a person may read it, a `message`
    sentence (the Error schema). Visibility follows the request scope
    of web-accounts.md section 9: something the viewer may not see
    answers exactly like something that does not exist, 404
    not_found, never 403.
servers:
  - url: /
security:
  - session: []
tags:
  - name: service
    description: Health of the service.
  - name: auth
    description: Signing in and out, the current session.
  - name: files
    description: File bytes behind /files/<token> links.
  - name: pages
    description: Page data for the React application (docs/design/web-ssr.md).
  - name: chats
    description: Chat message windows and the chat search of the pickers.
  - name: account
    description: The signed-in account's own settings.
  - name: accounts
    description: Administration of accounts and federations.
  - name: forwarding
    description: Telegram to Discord and Discord to Telegram forwarding.
  - name: join-chat
    description: Joining Telegram groups and channels with the logging account.
  - name: mcp
    description: Administration of the MCP endpoint's exposed groups and tokens.

paths:

  /api/health:
    get:
      operationId: getHealth
      tags: [service]
      summary: Check both database pools
      description: >-
        Needs no session; for probes and for checking the routing. The
        answer says only which pool failed; the reason goes to the
        service's log.
      security: []
      responses:
        '200':
          description: Both pools answer.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: >-
            A pool did not answer within a few seconds; its check reads
            "unavailable" and so does status.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/login:
    get:
      operationId: getLogin
      tags: [auth]
      summary: Start a sign-in
      description: >-
        Answers a pre-login CSRF token and sets it as the tgw_csrf
        cookie (path /api/login), to be sent back with POST
        /api/login. A request whose session cookie has a valid
        signature gets signed_in true and no token; the cookie's
        session_epoch is not checked here, as the Drogon login page
        does not check it either.
      security: []
      responses:
        '200':
          description: The sign-in state, and a token when signed out.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: tgw_csrf, the pre-login token, when signed_in is false.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginState'
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      description: >-
        Checks, in this order: the pre-login CSRF token against its
        cookie, the body, the login throttle (per client address and
        username, in the process's memory), then the account and its
        password. Each attempt past the CSRF check and the body is
        audited (login_ok, login_fail or login_ratelimited). Refused
        attempts answer a fresh pre-login token in `csrf` and set it as
        the cookie, so the client can try again.
      security:
        - loginCsrf: []
          loginCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in; the session cookie is set.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: tgw_session, the signed session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: The body is not a JSON object (error bad_request).
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: >-
            No such account, a disabled one, or a wrong password (error
            invalid_credentials), with a fresh token.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/LoginCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError'
        '403':
          description: >-
            The token or its cookie is missing or wrong (error csrf),
            with a fresh token.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/LoginCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError'
        '429':
          description: >-
            Too many failures for this address and username within the
            throttle's window (error rate_limited), with a fresh token.
            No Retry-After is sent.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/LoginCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError'
        '500':
          $ref: '#/components/responses/Internal'

  /api/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out this browser
      description: >-
        Clears the session cookie and audits a logout when the cookie
        opens. The account's other sessions stay signed in. The CSRF
        token must match the session cookie; a request without a
        session cookie fails that check.
      security:
        - session: []
          csrf: []
      responses:
        '204':
          description: Signed out; the session cookie is cleared.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: tgw_session, expired.
              schema:
                type: string
        '403':
          description: The CSRF token is missing or wrong (error csrf).
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'

  /api/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Who is signed in
      description: >-
        The account of a valid session (signature, expiry and the
        account's session_epoch) and the CSRF token to send with it.
      responses:
        '200':
          description: The session's account and CSRF token.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /files/{token}:
    get:
      operationId: getFile
      tags: [files]
      summary: A file's bytes
      description: >-
        Serves a logged file, from the store or fetched from Telegram
        through the daemon; web/docs/media.md has the details. The
        token is the encrypted file id; one that does not open answers
        like an unknown id. The route is public: a session only allows
        fetching big files and makes the request audited. HEAD is
        answered like GET, without the body.


        Error answers are small HTML pages, not JSON, since a browser
        following a link or loading an image gets them.
      security:
        - {}
        - session: []
      parameters:
        - name: token
          in: path
          required: true
          description: The file token, as minted into the pages and the API.
          schema:
            type: string
        - name: Range
          in: header
          required: false
          description: >-
            A byte range. A stored file honours several ranges
            (multipart/byteranges); a partial file from TDLib's cache
            answers at most the bytes it holds from the first range's
            start.
          schema:
            type: string
        - name: If-Range
          in: header
          required: false
          schema:
            type: string
        - name: If-Modified-Since
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The whole file.
          headers:
            Accept-Ranges:
              $ref: '#/components/headers/AcceptRanges'
            Cache-Control:
              $ref: '#/components/headers/FileCacheControl'
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
            Last-Modified:
              description: For a stored file.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '206':
          description: >-
            The requested range, or for a file still being fetched the
            part of it already there; Content-Range carries the file's
            full size.
          headers:
            Accept-Ranges:
              $ref: '#/components/headers/AcceptRanges'
            Cache-Control:
              $ref: '#/components/headers/FileCacheControl'
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
            multipart/byteranges:
              schema:
                type: string
        '304':
          description: Not modified since If-Modified-Since (a stored file).
        '403':
          description: >-
            Not in the store and too big to fetch without a session
            ("Sign in to load this file").
          content:
            text/html:
              schema:
                type: string
        '404':
          description: >-
            No such file, a token that does not open, or not in the
            store while fetching from Telegram is not configured.
          content:
            text/html:
              schema:
                type: string
        '410':
          description: The file is no longer available on Telegram.
          content:
            text/html:
              schema:
                type: string
        '416':
          description: The range is outside the file.
          headers:
            Content-Range:
              description: bytes */<size>, when the size is known.
              schema:
                type: string
        '500':
          description: The file could not be served.
          content:
            text/html:
              schema:
                type: string
        '502':
          description: The daemon answered something unexpected.
          content:
            text/html:
              schema:
                type: string
        '503':
          description: >-
            The daemon is busy, unreachable or not signed in to
            Telegram, or the file moved while it was being opened; try
            again after Retry-After seconds.
          headers:
            Retry-After:
              description: Seconds to wait before asking again.
              schema:
                type: integer
          content:
            text/html:
              schema:
                type: string
        '504':
          description: >-
            Telegram took too long; the fetch goes on in the background.
          content:
            text/html:
              schema:
                type: string

  /api/page/{path}:
    get:
      x-tgd-status: planned
      operationId: getPage
      tags: [pages]
      summary: A page's data
      description: >-
        The data of the page at /<path>, the same object the server
        embeds in the page's HTML on a first load (web-ssr.md sections
        5 and 7), for navigation in the browser. `path` is the page's
        path without its leading slash (empty for the dashboard at /);
        its slashes may be sent as they are or encoded as %2F. The
        page's query string (search, filters, sort, page) is passed on
        as the query string of this request.


        The route ids and their page paths:
        login /login;
        dashboard /;
        users /users;
        user /users/{id};
        user_history /users/{id}/history;
        user_chat /users/{id}/chat;
        groups /groups;
        group /groups/{id};
        group_admins /groups/{id}/admins;
        group_history /groups/{id}/history;
        group_chat /groups/{id}/chat;
        files /files;
        group_messages /group_messages;
        private_messages /private_messages;
        message /messages/{group|private}/{id};
        settings /settings;
        settings_preferences /settings/preferences;
        settings_sessions /settings/sessions;
        accounts /settings/accounts;
        federations /settings/federations;
        platform_fwd /platform-fwd;
        fwd_telegram_discord /platform-fwd/telegram-discord;
        fwd_discord_telegram /platform-fwd/discord-telegram;
        join_chat /join-chat;
        mcp /mcp-admin;
        mcp_groups /mcp-admin/groups;
        mcp_tokens /mcp-admin/tokens;
        password_forgot /password/forgot;
        password_set /password/set;
        email_verify /account/email/verify.


        password_forgot, password_set and email_verify are served to
        signed-out and signed-in visitors alike, and their GETs change
        nothing: the link token travels in the URL's fragment, which
        never reaches the server, and is posted only when the person
        acts on the page.


        A signed-in account with no verified email address
        (web-accounts.md section 8) gets the email_required route for
        every page path except those three, until an address is
        verified; its API operations answer 403 email_required, except
        session, logout, the account's email operations and the three
        link operations.


        A path the service does not serve as a React page yet answers
        {"reload": true}, and the browser loads it in full. Something
        the viewer may not see answers 404 with the not_found route,
        exactly like something that does not exist.
      security:
        - {}
        - session: []
      parameters:
        - name: path
          in: path
          required: true
          description: The page's path without the leading slash.
          schema:
            type: string
        - name: query
          in: query
          required: false
          description: The page's own query string, passed on unchanged.
          style: form
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
      responses:
        '200':
          description: The page data, or a request to load the page in full.
          headers:
            Cache-Control:
              description: private, no-store for a signed-in request.
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PageAnswer'
                  - $ref: '#/components/schemas/PageReload'
        '401':
          description: >-
            The page needs a session and the request has none (error
            unauthenticated); the browser loads the page in full and
            lands on the sign-in page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such page or nothing the viewer may see.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageNotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/chats/{scope}/{id}/messages:
    get:
      x-tgd-status: planned
      operationId: getChatMessages
      tags: [chats]
      summary: A window of a chat's messages
      description: >-
        Messages of a group or a private chat, oldest first, for
        scrolling and live updates. At most one of before, after and
        around is given; with none the window is the newest messages.
        Replaces the Drogon /v1/chats/{scope}/{id}/messages with the
        message shape of the chat pages.
      parameters:
        - $ref: '#/components/parameters/ChatScope'
        - name: id
          in: path
          required: true
          description: The group's chat id, or the user's id for a private chat.
          schema:
            type: integer
            format: int64
        - name: before
          in: query
          required: false
          description: Messages older than this message id.
          schema:
            type: integer
            format: int64
        - name: after
          in: query
          required: false
          description: Messages newer than this message id.
          schema:
            type: integer
            format: int64
        - name: around
          in: query
          required: false
          description: Messages around this message id, which is included.
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 60
      responses:
        '200':
          description: The window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatWindow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/chats/search:
    get:
      x-tgd-status: planned
      operationId: searchChats
      tags: [chats]
      summary: Search chats for a picker
      description: >-
        Groups and private chats the viewer may see whose title or
        username matches q; an empty q lists the busiest first. Without
        kind both kinds are searched. A member, or an admin restricted
        from private messages, gets groups only (web-accounts.md
        sections 4 and 5). Paged by an opaque cursor.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [group, user]
        - name: federation
          in: query
          required: false
          description: Only the groups of this federation; 0 is Default.
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - name: cursor
          in: query
          required: false
          description: The next_cursor of the previous page.
          schema:
            type: string
      responses:
        '200':
          description: A page of matches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSearchPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/account/password:
    post:
      x-tgd-status: planned
      operationId: changePassword
      tags: [account]
      summary: Change the password
      description: >-
        Every other session of the account ends (its session_epoch
        moves on). This one is issued a new session cookie, which
        changes its CSRF token: the answer carries the new one.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  description: At least the minimum length; no maximum below the body limit.
      responses:
        '200':
          description: Changed; a new session cookie is set.
          headers:
            Set-Cookie:
              description: tgw_session, reissued.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '400':
          description: >-
            A wrong current password (error wrong_password), a new one
            too short (error weak_password), or a malformed body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/account/email:
    post:
      x-tgd-status: planned
      operationId: changeEmail
      tags: [account]
      summary: Change the email address
      description: >-
        Sends a verification link to the new address, which is used
        only once verified, and a notice to the old one
        (web-accounts.md section 8).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '202':
          description: The verification link is on its way.
        '400':
          description: >-
            A wrong password (error wrong_password), an address that is
            not one (error bad_email), or a malformed body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/account/email/verify:
    post:
      x-tgd-status: planned
      operationId: verifyEmail
      tags: [account]
      summary: Verify an email address
      description: >-
        Takes the token of a verification link (web-accounts.md
        section 8), <site>/account/email/verify#token=<token>. Links
        are single-use and expire. Needs no session: the link may be
        opened in another browser.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '204':
          description: The address is verified.
        '400':
          description: The link is unknown, used or expired (error bad_link).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/password/forgot:
    post:
      x-tgd-status: planned
      operationId: forgotPassword
      tags: [account]
      summary: Ask for a password reset link
      description: >-
        Sends a one-time reset link to the account's verified address
        (web-accounts.md section 8). The answer is the same whether or
        not such an account exists. Carries the pre-login CSRF token of
        GET /api/login, like a sign-in.
      security:
        - loginCsrf: []
          loginCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  description: The account's username or email address.
      responses:
        '202':
          description: A link is sent if the account has a verified address.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Csrf'
        '429':
          description: Too many requests (error rate_limited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/password/set:
    post:
      x-tgd-status: planned
      operationId: setPassword
      tags: [account]
      summary: Set a password from a link
      description: >-
        Takes the token of a set-password link (a new account's
        invitation, or a reset), <site>/password/set#token=<token>, and
        the new password. Every session of the account ends.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                new_password:
                  type: string
      responses:
        '204':
          description: The password is set; the account can sign in with it.
        '400':
          description: >-
            The link is unknown, used or expired (error bad_link), or
            the password is too short (error weak_password).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/account/preferences:
