        - type: object
          required: [route, props]
          properties:
            route:
              enum: [mcp_tokens]
            props:
              $ref: '#/components/schemas/McpTokensProps'

    # Shapes shared by the pages and the chat operations.
    LiveEvent:
      type: object
      description: >-
        One event of GET /api/events: what changed, never the content.
        Ids are as stored: chat_id is Telegram's chat id (negative for
        groups, the other user's id for private chats), message_id the
        message tables' message_id, file_id the file's id.
      required: [kind]
      properties:
        seq:
          type: integer
          format: int64
          description: >-
            Grows with each event and is the frame's id; compare, do not
            compute with it. Absent on a session event.
        kind:
          type: string
          enum: [hello, resync, session, message.new, message.edited, message.deleted, user.updated, group.updated, file.stored, stats.changed]
          description: The frame's event name. New kinds may be added.
        chat_id:
          type: integer
          format: int64
          description: message.*, file.stored (for message media), group.updated.
        message_id:
          type: integer
          format: int64
          description: message.*, file.stored (for message media).
        user_id:
          type: integer
          format: int64
          description: user.updated.
        file_id:
          type: integer
          format: int64
          description: file.stored.
        fields:
          type: array
          items:
            type: string
          description: >-
            user.updated and group.updated, when present: the parts
            that may have changed (users: name, photo, bio, birthday,
            personal_chat; groups: photo, admins). Absent: anything.
        chat_ids:
          type: array
          items:
            type: integer
            format: int64
          description: >-
            stats.changed: the visible chats whose counters moved
            (groups negative, private chats positive).
        user_ids:
          type: array
          items:
            type: integer
            format: int64
          description: stats.changed, the visible senders whose message counts moved.
        more:
          type: boolean
          description: stats.changed, the lists were cut; treat every counter as changed.
        reason:
          type: string
          enum: [revoked, scope_changed]
          description: session, why the stream ends.
    UserSummary:
      type: object
      required: [id, name, username, type, photo]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        username:
          type: string
        type:
          type: string
          enum: [regular, bot, deleted, unknown]
        photo:
          type: [string, 'null']
          description: A /files/<token> URL.
        contact_name:
          type: string
        msg_count:
          type: integer
          description: Full-access viewers only; absent for members.
        is_verified:
          type: boolean
        is_premium:
          type: boolean
        is_scam:
          type: boolean
        is_fake:
          type: boolean
        is_support:
          type: boolean
        language:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
    UserFull:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          required: [first_name, last_name, bio, phone, usernames]
          properties:
            first_name:
              type: string
            last_name:
              type: string
            bio:
              type: string
            phone:
              type: string
            usernames:
              type: array
              items:
                type: object
                required: [username, active]
                properties:
                  username:
                    type: string
                  active:
                    type: boolean
    GroupSummary:
      type: object
      required: [id, title, username, type, photo]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        username:
          type: string
        type:
          type: string
          enum: [supergroup, basic_group, channel]
        photo:
          type: [string, 'null']
        msg_count:
          type: integer
        exposed:
          type: boolean
    GroupCounted:
      allOf:
        - $ref: '#/components/schemas/GroupSummary'
        - type: object
          required: [msg_count]
          properties:
            msg_count:
              type: integer
    GroupFull:
      allOf:
        - $ref: '#/components/schemas/GroupSummary'
        - type: object
          required: [description, members, msg_count, admin_count, created_at, updated_at]
          properties:
            description:
              type: string
            members:
              type: integer
              description: The member count; not recorded by the logger yet, so 0.
            msg_count:
              type: integer
            admin_count:
              type: integer
            created_at:
              type: string
            updated_at:
              type: string
    GroupAdmin:
      type: object
      required: [user, status, custom_title, is_anonymous, perms, since]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        status:
          type: string
          enum: [creator, administrator]
        custom_title:
          type: string
        is_anonymous:
          type: boolean
        perms:
          type: array
          items:
            type: string
        since:
          type: string
    HistoryEntry:
      type: object
      required: [kind, at]
      properties:
        kind:
          type: string
          enum: [name, username, bio, phone, photo]
        at:
          type: string
        detail:
          type: string
        action:
          type: string
          enum: [added, removed]
        photo:
          type: [string, 'null']
        removed:
          type: boolean
    GroupHistoryEntry:
      type: object
      required: [kind, at]
      properties:
        kind:
          type: string
          enum: [title, description, username, photo, admin]
        at:
          type: string
        detail:
          type: string
        action:
          type: string
        photo:
          type: [string, 'null']
        removed:
          type: boolean
        user:
          $ref: '#/components/schemas/UserSummary'
    MessageScope:
      type: string
      enum: [group, private]
    ContentType:
      type: string
      enum: [text, photo, video, document, audio, voice, sticker, animation, service, unknown]
    ChatRef:
      type: object
      required: [id, title, kind, photo]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        kind:
          type: string
          enum: [group, user]
        photo:
          type: [string, 'null']
    Entities:
      type: object
      required: [users, groups]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupSummary'
    PickItem:
      type: object
      description: A chat as the pickers show it; sub is a short second line.
      required: [id, title, kind]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        kind:
          type: string
          enum: [group, user]
        sub:
          type: string
        photo:
          type: [string, 'null']
    ChatSearchPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PickItem'
        next_cursor:
          type: [string, 'null']
    SearchField:
      type: object
      description: A searchable field of the registry.
      required: [key, label, type, sortable, operators]
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [text, int, bool, datetime, enum]
        sortable:
          type: boolean
        operators:
          type: array
          items:
            type: string
            enum: ['=', '!=', '<', '>', '<=', '>=', LIKE, NOT LIKE, '%LIKE%', 'NOT %LIKE%', matches, IS NULL, IS NOT NULL]
        enum:
          type: string
          description: An enum field's values, comma-separated.
    SearchCol:
      type: object
      description: >-
        A displayed column: its render type, and the field key a click
        on its header sorts by ("" for none).
      required: [key, label, type, sort]
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [photo, filethumb, id, name, username, bool, int, datetime, text, longtext, party, fileid, hash]
        sort:
          type: string
    SearchParty:
      type: object
      description: A message row's linked avatar and name; strings HTML-escaped.
      required: [id, kind, name, photo, username]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [user, group, self, none]
        name:
          type: string
        photo:
          type: string
          description: A /files/<token> URL, or "".
        username:
          type: string
    SearchAnswer:
      type: object
      required: [fields, cols, rows, total, total_exact, limit, offset, max_offset, sort, order]
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SearchField'
        cols:
          type: array
          items:
            $ref: '#/components/schemas/SearchCol'
        rows:
          type: array
          description: >-
            One array per row, aligned to cols: id cells are numbers,
            bool cells booleans, party cells SearchParty objects, every
            other cell a string, already HTML-escaped.
          items:
            type: array
            items:
              oneOf:
                - type: string
                - type: integer
                  format: int64
                - type: boolean
                - $ref: '#/components/schemas/SearchParty'
        total:
          type: integer
          format: int64
        total_exact:
          type: boolean
          description: >-
            false when total is an estimate: the table's row estimate
            for a viewer who sees the whole table and gave no
            condition, or, when counting ran out of time, what the page
            proves (offset plus its rows, plus one when it is full).
        limit:
          type: integer
        offset:
          type: integer
        max_offset:
          type: integer
          description: The deepest offset a request can reach.
        sort:
          type: string
          description: The field key sorted by; "" for the default or relevance.
        order:
          type: string
          enum: [asc, desc]
        debug:
          $ref: '#/components/schemas/SearchDebug'
    SearchDebug:
      type: object
      description: The page query, the count, their values and the plan; HTML-escaped.
      required: [sql, count_sql, bind, explain]
      properties:
        sql:
          type: string
        count_sql:
          type: string
        bind:
          type: array
          items:
            type: string
        explain:
          type: object
          required: [columns, rows]
          properties:
            columns:
              type: array
              items:
                type: string
            rows:
              type: array
              items:
                type: array
                items:
                  type: string
    FileRow:
      type: object
      required: [id, file_type, name, ext, size, hits, stored, created_at, tg_file_id, url, thumb, chat, sender, message]
      properties:
        id:
          type: integer
          format: int64
        file_type:
          type: string
          enum: [photo, video, document, audio, voice, sticker, animation, unknown]
        name:
          type: string
        ext:
          type: string
        size:
          type: integer
          format: int64
        hits:
          type: integer
        stored:
          type: boolean
        created_at:
          type: string
        duration:
          type: integer
        tg_file_id:
          type: string
        url:
          type: [string, 'null']
        thumb:
          type: [string, 'null']
        chat:
          type: object
          required: [id, title, kind]
          properties:
            id:
              type: integer
              format: int64
            title:
              type: string
            kind:
              type: string
              enum: [group, user]
        sender:
          oneOf:
            - $ref: '#/components/schemas/IdName'
            - type: 'null'
        message:
          $ref: '#/components/schemas/MessageRef'
    IdName:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    MessageRef:
      type: object
      required: [scope, id]
      properties:
        scope:
          $ref: '#/components/schemas/MessageScope'
        id:
          type: integer
          format: int64
    MessageRow:
      type: object
      required: [id, scope, message_id, date, chat, sender, content_type, snippet, forwarded, edited, deleted_at]
      properties:
        id:
          type: integer
          format: int64
        scope:
          $ref: '#/components/schemas/MessageScope'
        message_id:
          type: integer
          format: int64
        date:
          type: string
        chat:
          $ref: '#/components/schemas/ChatRef'
        sender:
          description: null for messages the logging account sent.
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        content_type:
          $ref: '#/components/schemas/ContentType'
        snippet:
          type: string
        forwarded:
          type: [string, 'null']
        edited:
          type: boolean
        deleted_at:
          type: [string, 'null']
    Edit:
      type: object
      required: [at, text]
      properties:
        at:
          type: string
        text:
          type: string
    MessageFull:
      allOf:
        - $ref: '#/components/schemas/MessageRow'
        - type: object
          required: [text, reply_to, edits, edited_at, media]
          properties:
            text:
              type: string
            reply_to:
              oneOf:
                - type: object
                  required: [scope, id, sender_name, snippet]
                  properties:
                    scope:
                      $ref: '#/components/schemas/MessageScope'
                    id:
                      type: integer
                      format: int64
                    sender_name:
                      type: string
                    snippet:
                      type: string
                - type: 'null'
            edits:
              type: array
              items:
                $ref: '#/components/schemas/Edit'
            edited_at:
              type: [string, 'null']
            media:
              oneOf:
                - type: object
                  required: [file_id, name, size, stored, thumb, url]
                  properties:
                    file_id:
                      type: integer
                      format: int64
                    name:
                      type: string
                    size:
                      type: integer
                      format: int64
                    duration:
                      type: integer
                    stored:
                      type: boolean
                    thumb:
                      type: [string, 'null']
                    url:
                      type: [string, 'null']
                - type: 'null'
    ChatMedia:
      type: object
      description: >-
        A message's file (web/docs/media.md). url is the /files/<token>
        URL when the bytes are stored or may be fetched from Telegram,
        else null; thumb is the same URL for a picture.
      required: [stored, thumb, url]
      properties:
        stored:
          type: boolean
        fetchable:
          type: boolean
          description: >-
            The bytes are not stored and the viewer may have them
            fetched from Telegram: the daemon API is on, and a viewer
            without a session asks only for a file under the store's
            per-file cap.
        thumb:
          type: [string, 'null']
        url:
          type: [string, 'null']
        w:
          type: integer
        h:
          type: integer
        duration:
          type: integer
        name:
          type: string
        size:
          type: integer
          format: int64
        emoji:
          type: string
        wave:
          type: array
          description: >-
            A voice note's waveform as Telegram encodes it, decoded:
            one 5-bit value per bar, usually 100 bars. Absent when
            the archive does not record it.
          items:
            type: integer
            minimum: 0
            maximum: 31
    ChatMessage:
      type: object
      required: [id, message_id, date, scope, sender, content_type, text, media, album, reply_to, forward, edits, edited_at, deleted_at, link_preview]
      properties:
        id:
          type: integer
          format: int64
        message_id:
          type: integer
          format: int64
        date:
          type: string
        scope:
          $ref: '#/components/schemas/MessageScope'
        sender:
          description: null when the logging account sent it.
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        content_type:
          $ref: '#/components/schemas/ContentType'
        text:
          type: string
        media:
          oneOf:
            - $ref: '#/components/schemas/ChatMedia'
            - type: 'null'
        album:
          type: array
          items:
            $ref: '#/components/schemas/ChatMedia'
        reply_to:
          oneOf:
            - type: object
              required: [message_id, sender_id, sender_name, snippet]
              properties:
                message_id:
                  type: integer
                  format: int64
                sender_id:
                  type: integer
                  format: int64
                sender_name:
                  type: string
                snippet:
                  type: string
                chat_id:
                  type: integer
                  format: int64
                  description: >-
                    The chat of a target in another chat; absent for
                    a target in this one.
            - type: 'null'
        forward:
          type: [string, 'null']
        edits:
          type: array
          items:
            $ref: '#/components/schemas/Edit'
        edited_at:
          type: [string, 'null']
        deleted_at:
          type: [string, 'null']
        link_preview:
          oneOf:
            - type: object
              required: [site, title, desc]
              properties:
                site:
                  type: string
                title:
                  type: string
                desc:
                  type: string
                url:
                  type: string
                media:
                  $ref: '#/components/schemas/ChatMedia'
            - type: 'null'
    ChatWindow:
      type: object
      description: Messages oldest first, and whether more lie either side.
      required: [messages, has_older, has_newer]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        has_older:
          type: boolean
        has_newer:
          type: boolean

    # Lists: the rows of a list page and its state from the query string.
    Cond:
      type: object
      required: [field, op, value]
      properties:
        field:
          type: string
        op:
          type: string
          enum: ['=', '!=', '>', '<', contains, empty, is]
        value:
          type: string
    ListState:
      type: object
      required: [total, page, pages, per, sort, dir, q, conds]
      properties:
        total:
          type: integer
          format: int64
        page:
          type: integer
        pages:
          type: integer
        per:
          type: integer
        sort:
          type: string
        dir:
          type: string
          enum: [asc, desc]
        q:
          type: string
        conds:
          type: array
          items:
            $ref: '#/components/schemas/Cond'
        archive_total:
          type: integer
          format: int64
          description: Everything in the archive; full-access viewers only.

    # Page props, one per route (web/app/src/routes/).
    EmailRequiredProps:
      type: object
      required: [pending, next]
      properties:
        pending:
          type: [string, 'null']
          description: >-
            An address added but not verified yet, to which a
            verification link was sent; null when none was added.
        next:
          type: string
          description: The page that was asked for, to go on to once verified.
    PasswordChangeProps:
      type: object
      description: >-
        The forced password change after a temporary password
        (decisions/2026-11-18-temporary-passwords.md); the page posts
        to POST /api/account/password, then loads `next`.
      required: [username, next]
      properties:
        username:
          type: string
        next:
          type: string
          description: The path of the page asked for.
    LoginProps:
      type: object
      required: [next]
      properties:
        next:
          type: [string, 'null']
          description: Where to go after signing in; same-site paths only.
    DashboardProps:
      type: object
      required: [kpis, per_day, busiest, deleted]
      properties:
        kpis:
          type: array
          items:
            type: object
            required: [key, total, today]
            properties:
              key:
                type: string
                enum: [users, groups, group_messages, private_messages, files]
              total:
                type: integer
                format: int64
              today:
                type: integer
                format: int64
        per_day:
          type: array
          items:
            type: integer
        busiest:
          type: array
          items:
            $ref: '#/components/schemas/GroupCounted'
        deleted:
          type: array
          items:
            type: object
            required: [id, scope, chat, sender, snippet, deleted_at, message_id]
            properties:
              id:
                type: integer
                format: int64
              scope:
                $ref: '#/components/schemas/MessageScope'
              chat:
                $ref: '#/components/schemas/GroupSummary'
              sender:
                $ref: '#/components/schemas/UserSummary'
              snippet:
                type: string
              deleted_at:
                type: string
              message_id:
                type: integer
                format: int64
        status:
          type: object
          required: [session, last_message_at, forwarding_active, store_used, store_total, store_ratio]
          properties:
            session:
              type: string
              enum: [connected, disconnected]
            last_message_at:
              type: string
            forwarding_active:
              type: integer
            store_used:
              type: string
            store_total:
              type: string
            store_ratio:
              type: number
    UsersProps:
      allOf:
        - $ref: '#/components/schemas/ListState'
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: '#/components/schemas/UserSummary'
    UserProps:
      description: >-
        A full-access viewer gets the profile; a member only the groups
        it shares with the person (limited), web-accounts.md section 5.
      oneOf:
        - type: object
          required: [user, groups, history, activity, can_private]
          properties:
            limited:
              type: boolean
              const: false
            user:
              $ref: '#/components/schemas/UserFull'
            groups:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/GroupSummary'
                  - type: object
                    required: [msgs]
                    properties:
                      msgs:
                        type: integer
            history:
              type: array
              items:
                $ref: '#/components/schemas/HistoryEntry'
            activity:
              type: array
              items:
                type: integer
            can_private:
              type: boolean
        - type: object
          required: [limited, user, shared_groups]
          properties:
            limited:
              type: boolean
              const: true
            user:
              $ref: '#/components/schemas/UserSummary'
            shared_groups:
              type: array
              items:
                $ref: '#/components/schemas/GroupSummary'
    GroupsProps:
      allOf:
        - $ref: '#/components/schemas/ListState'
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/GroupSummary'
                  - type: object
                    required: [msg_count, admin_count, description, created_at]
                    properties:
                      msg_count:
                        type: integer
                      admin_count:
                        type: integer
                      description:
                        type: string
                      created_at:
                        type: string
    GroupProps:
      type: object
      required: [group, admins, history, top_posters, activity]
      properties:
        group:
          $ref: '#/components/schemas/GroupFull'
        admins:
          type: array
          items:
            $ref: '#/components/schemas/GroupAdmin'
        history:
          type: array
          items:
            $ref: '#/components/schemas/GroupHistoryEntry'
        top_posters:
          type: array
          items:
            type: object
            required: [user, msgs]
            properties:
              user:
                $ref: '#/components/schemas/UserSummary'
              msgs:
                type: integer
        activity:
          type: array
          items:
            type: integer
    FilesProps:
      allOf:
        - $ref: '#/components/schemas/ListState'
        - type: object
          required: [rows, preview, can_fetch]
          properties:
            rows:
              type: array
              items:
                $ref: '#/components/schemas/FileRow'
            preview:
              oneOf:
                - $ref: '#/components/schemas/FileRow'
                - type: 'null'
            can_fetch:
              type: boolean
            stored_bytes:
              type: integer
              format: int64
    MessagesProps:
      allOf:
        - $ref: '#/components/schemas/ListState'
        - type: object
          required: [rows, scope]
          properties:
            rows:
              type: array
              items:
                $ref: '#/components/schemas/MessageRow'
            scope:
              $ref: '#/components/schemas/MessageScope'
    MessageProps:
      type: object
      required: [message]
      properties:
        message:
          $ref: '#/components/schemas/MessageFull'
    ChatProps:
      type: object
      description: >-
        The chat page's first window (getChatMessages, limit 60). The
        page's query opens it at a message (?at=<message id>, around
        it) or a day (?date=YYYY-MM-DD in UTC, around the day's first
        message, which `at` then names); without either, or past the
        end, the newest messages.
      required: [chat, messages, has_older, has_newer, at]
      properties:
        chat:
          oneOf:
            - type: object
              required: [kind, group]
              properties:
                kind:
                  const: group
                group:
                  allOf:
                    - $ref: '#/components/schemas/GroupSummary'
                    - type: object
                      required: [members, msg_count]
                      properties:
                        members:
                          type: integer
                          description: Not recorded by the logger yet, so 0.
                        msg_count:
                          type: integer
            - type: object
              required: [kind, user, count]
              properties:
                kind:
                  const: user
                user:
                  type: object
                  required: [id, name, photo]
                  properties:
                    id:
                      type: integer
                      format: int64
                    name:
                      type: string
                    photo:
                      type: [string, 'null']
                count:
                  type: integer
                  format: int64
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        has_older:
          type: boolean
        has_newer:
          type: boolean
        at:
          type: [integer, 'null']
          format: int64
          description: The message the page was opened at, if any.
    SettingsProps:
      type: object
      required: [account, notices]
      properties:
        account:
          type: object
          required: [username, name, role, email, email_verified]
          properties:
            username:
              type: string
            name:
              type: string
            role:
              type: string
            email:
              type: [string, 'null']
            email_verified:
              type: boolean
        notices:
          type: array
          items:
            type: string
    Prefs:
      type: object
      description: Every field null or absent is the site default.
      properties:
        timezone:
          type: [string, 'null']
        date_format:
          type: [string, 'null']
          enum: [24h, 12h, iso, null]
        lang:
          type: [string, 'null']
          enum: [en, id, null]
        theme:
          type: [string, 'null']
          enum: [system, light, dark, null]
        rows_per_page:
          type: [integer, 'null']
        landing:
          type: [string, 'null']
        chat_auto_load:
          type: [boolean, 'null']
        chat_live:
          type: [boolean, 'null']
        chat_media:
          type: [string, 'null']
          enum: [auto, click, null]
        chat_show_deleted:
          type: [boolean, 'null']
        chat_show_edited:
          type: [boolean, 'null']
        chat_show_service:
          type: [boolean, 'null']
    PreferencesProps:
      type: object
      required: [prefs, timezones, landing_options, pinned, saved_searches]
      properties:
        prefs:
          $ref: '#/components/schemas/Prefs'
        timezones:
          type: array
          items:
            type: string
        landing_options:
          type: array
          description: Pairs of [path, label].
          items:
            type: array
            prefixItems:
              - type: string
              - type: string
            minItems: 2
            maxItems: 2
        pinned:
          type: array
          items:
            type: object
            required: [id, title, photo]
            properties:
              id:
                type: integer
                format: int64
              title:
                type: string
              photo:
                type: [string, 'null']
        saved_searches:
          type: array
          items:
            type: object
            required: [id, title, url]
            properties:
              id:
                type: integer
                format: int64
              title:
                type: string
              url:
                type: string
    SessionsProps:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            type: object
            required: [id, device, ip, place, started, last, current]
            properties:
              id:
                type: string
              device:
                type: string
              ip:
                type: string
              place:
                type: string
              started:
                type: string
              last:
                type: string
              current:
                type: boolean

    # Accounts and federations.
    Ability:
      type: string
      enum: [forward, fetch_files]
    Fed:
      type: object
      required: [id, name, default]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        default:
          type: boolean
    Restrict:
      type: object
      description: An admin's restrictions (web-accounts.md section 4).
      required: [hide_private, hide_groups, join_chat]
      properties:
        hide_private:
          type: boolean
        hide_groups:
          type: array
          items:
            $ref: '#/components/schemas/PickItem'
        join_chat:
          type: boolean
          description: Whether the admin may join chats; off by default.
    AccountRow:
      type: object
      required: [id, username, name, email, email_verified, invited, role, active, last_signin, last_superadmin, admin_of, restrict, grants, abilities, audit]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        name:
          type: string
        email:
          type: [string, 'null']
        email_verified:
          type: boolean
          description: Always false until addresses are verified (web-email).
        invited:
          type: boolean
          description: >-
            Has not chosen its own password yet (it has a temporary
            one, or none).
        role:
          $ref: '#/components/schemas/Role'
        active:
          type: boolean
        last_signin:
          type: [string, 'null']
        last_superadmin:
          type: boolean
        admin_of:
          type: array
          items:
            type: integer
            format: int64
        restrict:
          oneOf:
            - $ref: '#/components/schemas/Restrict'
            - type: 'null'
        grants:
          type: array
          items:
            type: object
            required: [fed, groups]
            properties:
              fed:
                type: integer
                format: int64
              groups:
                type: array
                items:
                  $ref: '#/components/schemas/PickItem'
        abilities:
          type: array
          items:
            $ref: '#/components/schemas/Ability'
        audit:
          type: array
          items:
            type: object
            required: [what, by, at]
            properties:
              what:
                type: string
              by:
                type: string
              at:
                type: string
    GrantWrite:
      type: object
      required: [fed, group_ids]
      properties:
        fed:
          type: integer
          format: int64
        group_ids:
          type: array
          items:
            type: integer
            format: int64
    AccountCreate:
      type: object
      required: [username, name, email, role]
      properties:
        username:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        grants:
          type: array
          description: >-
            A member's federations and groups. Required, with at least
            one federation the viewer administers, when an admin
            creates the member (else 400 grants_required). Until
            web-federations, only {"fed": 0, "group_ids": []}.
          items:
            $ref: '#/components/schemas/GrantWrite'
    AccountCreated:
      type: object
      required: [id, temporary_password]
      properties:
        id:
          type: integer
          format: int64
        temporary_password:
          type: string
          description: >-
            Shown once; give it to the account's owner, who must
            replace it at the first sign-in. Goes when set-password
            links arrive (web-email).
    AccountPatch:
      type: object
      description: The fields to change; the others stay.
      properties:
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        email:
          type: string
          format: email
        admin_of:
          type: array
          description: An admin's federations; superadmins only.
          items:
            type: integer
            format: int64
        restrict:
          type: object
          description: An admin's restrictions; superadmins only.
          required: [hide_private, hide_groups, join_chat]
          properties:
            hide_private:
              type: boolean
            hide_groups:
              type: array
              items:
                type: integer
                format: int64
            join_chat:
              type: boolean
        grants:
          type: array
          description: >-
            A member's grants. An admin changes only those in its own
            federations; the others stay.
          items:
            $ref: '#/components/schemas/GrantWrite'
        abilities:
          type: array
          items:
            $ref: '#/components/schemas/Ability'
    AccountsProps:
      type: object
      required: [accounts, federations, all_federations, editable]
      properties:
        editable:
          type: object
          description: >-
            Which parts of an account the server can change today; the
            page offers only those. Each flag turns true when the item
            that builds it lands: federations (admin_of, and grants of
            federations other than Default) with web-federations,
            group_grants (groups inside a grant) with
            web-member-access, restrictions with
            web-admin-restrictions, abilities with web-member-access.
            Until then PATCH accepts these fields only unchanged and
            answers 400 not_supported to any change.
          required: [federations, group_grants, restrictions, abilities]
          properties:
            federations:
              type: boolean
            group_grants:
              type: boolean
            restrictions:
              type: boolean
            abilities:
              type: boolean
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountRow'
        federations:
          type: array
          description: >-
            The federations the viewer may manage, with how many groups
            it can see in each; the groups come from the chat search.
          items:
            allOf:
              - $ref: '#/components/schemas/Fed'
              - type: object
                required: [group_count]
                properties:
                  group_count:
                    type: integer
        all_federations:
          type: array
          items:
            $ref: '#/components/schemas/Fed'
    FedPerson:
      type: object
      required: [id, username, name]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        name:
          type: string
    FederationRow:
      type: object
      required: [id, name, default, created, groups, group_count, admins, members]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        default:
          type: boolean
        created:
          type: [string, 'null']
        groups:
          type: array
          description: Only the groups the viewer can see; group_count counts them all.
          items:
            $ref: '#/components/schemas/GroupSummary'
        group_count:
          type: integer
        admins:
          type: array
          items:
            $ref: '#/components/schemas/FedPerson'
        members:
          type: array
          items:
            $ref: '#/components/schemas/FedPerson'
    FederationsProps:
      type: object
      required: [federations, editable, admin_options]
      properties:
        federations:
          type: array
          items:
            $ref: '#/components/schemas/FederationRow'
        editable:
          type: boolean
        admin_options:
          type: array
          description: Admins that may be given a federation.
          items:
            $ref: '#/components/schemas/FedPerson'
    FederationWrite:
      type: object
      properties:
        name:
          type: string
        group_ids:
          type: array
          description: Not for the Default federation.
          items:
            type: integer
            format: int64
        admin_ids:
          type: array
          items:
            type: integer
            format: int64

    # Forwarding.
    T2DTypes:
      type: array
      description: The message kinds forwarded.
      items:
        type: string
        enum: [sticker, text, photo, video, document, other]
    D2TTypes:
      type: array
      description: The message kinds forwarded.
      items:
        type: string
        enum: [sticker, text, photo, video, document]
    FwdPerson:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        role:
          type: string
        active:
          type: boolean
    Owned:
      type: object
      required: [id, owner, federation, transfer_candidates]
      properties:
        id:
          type: integer
          format: int64
        owner:
          allOf:
            - $ref: '#/components/schemas/FwdPerson'
            - type: object
              required: [active]
              properties:
                active:
                  type: boolean
        federation:
          $ref: '#/components/schemas/FedRef'
        transfer_candidates:
          type: array
          items:
            $ref: '#/components/schemas/FwdPerson'
    FedRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    T2DRoute:
      allOf:
        - $ref: '#/components/schemas/Owned'
        - type: object
          required: [chat, url_masked, types, enabled, sent, last_sent]
          properties:
            chat:
              $ref: '#/components/schemas/PickItem'
            url_masked:
              type: string
              description: The webhook URL with its secret part cut off.
            types:
              $ref: '#/components/schemas/T2DTypes'
            enabled:
              type: boolean
            sent:
              type: integer
              format: int64
            last_sent:
              type: [string, 'null']
    D2TRoute:
      allOf:
        - $ref: '#/components/schemas/Owned'
        - type: object
          required: [channel_id, channel_name, chat, bot, types, enabled, sent]
          properties:
            channel_id:
              type: string
            channel_name:
              type: string
            chat:
              $ref: '#/components/schemas/PickItem'
            bot:
              type: string
              description: The sending bot's username; never its token.
            types:
              $ref: '#/components/schemas/D2TTypes'
            enabled:
              type: boolean
            sent:
              type: integer
              format: int64
    FwdCounts:
      type: object
      required: [active, total, sent]
      properties:
        active:
          type: integer
        total:
          type: integer
        sent:
          type: integer
          format: int64
    ForwardingIndexProps:
      type: object
      required: [t2d, d2t]
      properties:
        t2d:
          $ref: '#/components/schemas/FwdCounts'
        d2t:
          $ref: '#/components/schemas/FwdCounts'
    T2DProps:
      type: object
      required: [routes, federations]
      properties:
        routes:
          type: array
          items:
            $ref: '#/components/schemas/T2DRoute'
        federations:
          type: array
          items:
            $ref: '#/components/schemas/FedRef'
    D2TProps:
      type: object
      required: [routes, federations]
      properties:
        routes:
          type: array
          items:
            $ref: '#/components/schemas/D2TRoute'
        federations:
          type: array
          items:
            $ref: '#/components/schemas/FedRef'
    T2DCreate:
      type: object
      required: [chat_id, chat_kind, webhook_url, types, enabled]
      properties:
        chat_id:
          type: integer
          format: int64
        chat_kind:
          type: string
          enum: [group, user]
        webhook_url:
          type: string
          description: A Discord webhook URL; anything else is 400 bad_webhook.
        types:
          $ref: '#/components/schemas/T2DTypes'
        enabled:
          type: boolean
        federation_id:
          type: [integer, 'null']
          format: int64
    D2TCreate:
      type: object
      required: [discord_channel_id, chat_id, bot_token, types, enabled]
      properties:
        discord_channel_id:
          type: string
        chat_id:
          type: integer
          format: int64
        bot_token:
          type: string
        types:
          $ref: '#/components/schemas/D2TTypes'
        enabled:
          type: boolean
        federation_id:
          type: [integer, 'null']
          format: int64
    Transfer:
      type: object
      required: [owner_id]
      properties:
        owner_id:
          type: integer
          format: int64

    # Join chat.
    JoinChat:
      type: object
      required: [chat_id, title, type, member_count, username, is_member, needs_approval]
      properties:
        chat_id:
          type: integer
          format: int64
        title:
          type: string
        type:
          type: string
        member_count:
          type: integer
        username:
          type: string
        is_member:
          type: boolean
        needs_approval:
          type: boolean
        banned:
          type: boolean
        paid:
          type: boolean
    JoinOutcome:
      type: object
      required: [outcome, message, chat]
      properties:
        outcome:
          type: string
          description: >-
            The daemon's outcome: ok (a preview that found the chat),
            joined, already_member, request_sent, approval_required,
            declined, not_a_group, not_found, link_invalid, flood_wait,
            banned, too_many_chats or error.
        message:
          type: string
          description: The sentence to show; empty for ok.
        chat:
          oneOf:
            - $ref: '#/components/schemas/JoinChat'
            - type: 'null'
        ref:
          type: string
          description: The reference as the daemon normalised it.
        retry_after:
          type: integer
          description: Seconds to wait, with flood_wait.
    JoinChatProps:
      type: object
      required: [federations, recent]
      properties:
        federations:
          type: array
          description: Federations the viewer may file a joined group into.
          items:
            $ref: '#/components/schemas/FedRef'
        recent:
          type: array
          items:
            type: object
            required: [at, by, ref, title, outcome]
            properties:
              at:
                type: string
              by:
                type: string
              ref:
                type: string
              title:
                type: string
              outcome:
                type: string

    # MCP administration.
    McpIndexProps:
      type: object
      required: [exposed_groups, exposed_messages, active_tokens, last_used, endpoint]
      properties:
        exposed_groups:
          type: integer
        exposed_messages:
          type: integer
          format: int64
        active_tokens:
          type: integer
        last_used:
          type: [string, 'null']
        endpoint:
          type: string
    McpGroupsProps:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            type: object
            required: [group, public_now, note, added]
            properties:
              group:
                $ref: '#/components/schemas/GroupCounted'
              public_now:
                type: boolean
              note:
                type: string
              added:
                type: string
    McpTokensProps:
      type: object
      required: [tokens]
      properties:
        tokens:
          type: array
          items:
            type: object
            required: [id, name, owner, created, last_used, revoked]
            properties:
              id:
                type: integer
                format: int64
              name:
                type: string
              owner:
                type: string
              created:
                type: string
              last_used:
                type: [string, 'null']
              revoked:
                type: [string, 'null']
