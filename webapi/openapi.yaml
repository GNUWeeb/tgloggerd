        photo:
          type: [string, 'null']
          description: A /files/<token> URL.
        contact_name:
          type: string
        msg_count:
          type: integer
          description: Full-access viewers only; absent for members.
        is_verified:
          type: boolean
        is_premium:
          type: boolean
        is_scam:
          type: boolean
        is_fake:
          type: boolean
        is_support:
          type: boolean
